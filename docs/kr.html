    <!-- Hidden host for the handful of elements doswasmx's engine glue (script.js) still
         touches by id during init/boot; rivets also binds #maindiv (and #divInstructions
         below). The rest of the doswasmx demo UI — header, load/browse/settings/login
         buttons, ROM list, drag-drop zone, CPU/Advanced control bar, error box, modals —
         was removed as unreachable dead markup. -->
    <div id="maindiv" style="display:none">
        <div id="myProgress"></div>
        <input id="file-upload" type="file" multiple>
        <input id="file-import" type="file" multiple>
        <select id="romselect"></select>
        <div id="dropArea"></div>
    </div>

    <!-- #canvasDiv's id is hardcoded in doswasmx's script.js (resizeCanvas, fullscreen,
         mobile mode) so it can't be renamed — but it plays the same role as gensei-pc98's
         #canvas-wrap, and suiko-overrides.css styles it identically. -->
    <!-- no inline display:none: unlike gensei-pc98's #canvas-wrap (always visible),
         doswasmx's own JS normally starts this hidden and $('#canvasDiv').show()s it
         only after boot — but our #btn-start overlay lives inside it and must be
         clickable from the start, so we keep it visible here (its .show() later is a
         harmless no-op) and let the overlay cover it visually until Start is clicked. -->
    <div id="canvasDiv">
        <!-- id="canvas" is hardcoded in the Emscripten-generated glue (main.js) -->
        <canvas id="canvas" width="640" height="480"></canvas>
        <div id="overlay">
            <!-- shown in place of the start button while Win95 boots (suiko-boot.js) -->
            <img id="boot-cover" src="img/splash.png" alt="" hidden>
            <!-- Ataho's face, overlaid on the splash for the eye-blink animation -->
            <img id="boot-blink" alt="" hidden>
            <button id="btn-start" disabled><img src="img/splash-popup.png" alt=""><span class="btn-start-label">▶ 시작</span></button>
        </div>
        <div id="toast"></div>
    </div>

    <div id="divInstructions" class="container text-center" style="display: none;">
        <div class="alert alert-secondary mt-4" role="alert" rv-if="data.initialInstallation">
            Remember to always click the Save Drive button before exiting the page. That will commit your hard disk changes to the browser.<br>
            If you installed Windows then remember to shut down the OS before exiting the page.
        </div>
    </div>
