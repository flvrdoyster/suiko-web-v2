<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>환세취호전 KR 패치 에디터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', -apple-system, sans-serif; background: #1e1e1e; color: #d4d4d4; font-size: 14px; padding: 0 16px 40px; }

  .topbar { position: sticky; top: 0; z-index: 10; background: #181818; padding: 10px 0 8px; border-bottom: 1px solid #333; }
  .topbar-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  h1 { font-size: 15px; font-weight: 600; color: #bbb; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .stats { font-size: 12px; color: #666; display: inline-flex; align-items: center; }
  .save-btn { background: #2e2e2e; color: #ccc; border: 1px solid #4a4a4a; height: 28px; padding: 0 14px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; }
  .save-btn:hover:not(:disabled) { background: #3a3a3a; color: #fff; }
  .save-btn:disabled { background: #1e1e1e; color: #444; border-color: #2a2a2a; cursor: default; }
  .ghost-btn { background: transparent; color: #999; border: 1px solid #3a3a3a; height: 28px; padding: 0 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; transition: background .1s, transform .05s; }
  .ghost-btn:hover { background: #2a2a2a; color: #ddd; border-color: #555; }
  .ghost-btn:active { transform: scale(.95); }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { padding: 5px 12px; background: #252525; border: 1px solid #3a3a3a; color: #aaa; cursor: pointer; border-radius: 4px; font-size: 12px; font-family: inherit; transition: background .1s, transform .05s; }
  .tabs button:hover { background: #2e2e2e; }
  .tabs button:active { transform: scale(.95); }
  .tabs button.active { background: #1e3a5c; color: #7ec4f8; border-color: #3a6a9c; font-weight: 600; }
  .toolbar input[type="text"] { background: #252525; color: #ccc; border: 1px solid #3a3a3a; height: 28px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-family: inherit; }
  #searchBox { width: 280px; }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #888; cursor: pointer; user-select: none; white-space: nowrap; }
  .toolbar label input[type="checkbox"] { accent-color: #999; width: 12px; height: 12px; }
  .prob-nav { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #666; }
  .prob-nav button { background: #252525; border: 1px solid #3a3a3a; border-radius: 4px; height: 26px; padding: 0 8px; cursor: pointer; font-size: 12px; color: #999; font-family: inherit; }
  .prob-nav button:hover { background: #2e2e2e; color: #ccc; }
  .prob-nav .prob-count { color: #c04040; font-weight: 600; }

  /* 고정폭 레이아웃(PC98 방식): table-layout:fixed + 고정 px 컬럼. 브라우저 크기와
     무관하게 컬럼 폭이 일정 — 리사이즈마다 재계산·재배치 없음, 헤더/본문 정렬도 일치.
     OFF 84 + 원문 380 + 수정 412 + Byte 84 = 960 */
  table { width: 960px; border-collapse: collapse; font-size: 13px; table-layout: fixed; margin-top: 10px; }
  th { background: #1a1a1a; padding: 6px 8px; text-align: left; border-bottom: 1px solid #333; font-weight: 600; color: #666; font-size: 11px; position: sticky; top: var(--topbar-h, 84px); z-index: 5; white-space: nowrap; }
  td { padding: 5px 8px; border-bottom: 1px solid #252525; vertical-align: top; }
  tr:hover { background: #232323; }
  tr.prob-focus { outline: 2px solid #c04040; outline-offset: -2px; }
  .off { width: 84px; color: #555; font-family: monospace; font-size: 11px; }
  .orig { width: 380px; color: #999; white-space: pre-wrap; word-break: break-all; cursor: pointer; }
  .orig:hover { background: #1e2433; }
  .orig.copied { background: #1a3322; transition: background .1s; }
  /* 수정칸 = [입력 textarea][확정 버튼] flex 행. 버튼은 절대위치로 겹치지 않고 옆에
     붙는다. 버튼이 숨으면(수정칸에 내용 있으면) textarea가 전체 폭을 차지. */
  .fixed-cell { width: 412px; }
  .fixed-inner { display: flex; align-items: flex-start; gap: 6px; }
  .kr-input { flex: 1; min-width: 0; background: #252525; color: #d4d4d4; border: 1px solid #3a3a3a; padding: 4px 7px; border-radius: 4px; font-size: 13px; font-family: inherit; resize: none; overflow-y: hidden; line-height: 1.5; }
  .kr-input:focus { border-color: #666; outline: none; }
  .kr-input.modified { border-color: #b87820; background: #1e1600; }
  .kr-input.saved { border-color: #2a8040; }
  .kr-input.invalid { border-color: #c04040; background: #1e0d0d; }
  /* 확정(수정 없이 검수 완료) 토글 — 수정칸이 비어 있을 때만 표시 */
  .confirm-btn { flex: none; background: #252525; color: #777; border: 1px solid #3a3a3a; height: 26px; padding: 0 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: inherit; white-space: nowrap; }
  .confirm-btn:hover { background: #2e2e2e; color: #aaa; }
  tr.confirmed .kr-input { background: #152015; border-color: #2a452a; }
  tr.confirmed .kr-input::placeholder { color: #4a7a4a; }
  tr.confirmed .confirm-btn { background: #1a3d1a; color: #7dc87d; border-color: #2d5c2d; }
  tr.confirmed .confirm-btn:hover { background: #234d23; }
  .len { width: 84px; text-align: center; color: #555; font-size: 12px; white-space: nowrap; }
  .len.ok { color: #408040; }
  .len.bad { color: #c04040; font-weight: bold; }
  .len.empty { color: #3a3a3a; }

  #jpPanel { position: fixed; right: 0; top: 0; bottom: 0; width: 360px; background: #202020; border-left: 1px solid #3a3a3a; padding: 12px; overflow-y: auto; transform: translateX(100%); transition: transform .2s; z-index: 50; box-shadow: -4px 0 20px rgba(0,0,0,.4); }
  #jpPanel.open { transform: translateX(0); }
  #jpPanel h3 { font-size: 13px; color: #ccc; margin-bottom: 6px; }
  #jpPanel .hint { font-size: 11px; color: #777; margin-bottom: 10px; line-height: 1.5; }
  #jpSearchBox { width: 100%; }
  #jpResults { margin-top: 10px; }
  #jpResults .hit { margin-bottom: 12px; padding: 8px; background: #2a2a2a; border-radius: 4px; font-size: 12px; }
  #jpResults .hit .match { color: #ffd479; font-weight: bold; }
  #jpClose { float: right; background: none; border: none; color: #888; font-size: 16px; cursor: pointer; }
  .jp-line-row { display: flex; align-items: baseline; gap: 6px; justify-content: space-between; }
  .jp-line-row .off { color: #556; font-size: 10px; }

  /* KR<->JP anchor cascade (see computeJpTextForKr() below): the space under each dialogue
     row's original text shows either the JP line auto-filled from the nearest anchor above,
     or (if this row itself owns an anchor) that anchor's own JP line, styled distinctly. */
  .link-row { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; }
  .link-anchor { flex: none; background: #252525; color: #888; border: 1px solid #3a3a3a; border-radius: 4px; height: 22px; width: 22px; cursor: pointer; font-size: 12px; line-height: 1; position: relative; }
  .link-anchor:hover { background: #2e2e2e; color: #ddd; }
  .link-anchor.anchored { color: #ffd479; border-color: #7a6a3a; }
  .link-anchor.stopped { color: #c87d7d; border-color: #5c2d2d; }
  .jp-cascade-text { color: #6a8fae; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  .jp-cascade-text.is-anchor { color: #ffd479; }
  .jp-cascade-text.empty { color: #445; font-style: italic; }
  .jp-cascade-text.oob { color: #a55; }

  .anchor-popup { position: absolute; z-index: 200; background: #262626; border: 1px solid #4a4a4a; border-radius: 6px; padding: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.5); font-size: 12px; width: 240px; }
  .anchor-popup .lbl { color: #999; font-size: 11px; margin-bottom: 6px; display: block; }
  .anchor-popup input { width: 100%; background: #1a1a1a; color: #d4d4d4; border: 1px solid #3a3a3a; padding: 5px 7px; border-radius: 4px; font-size: 13px; font-family: inherit; margin-bottom: 8px; }
  .anchor-popup .actions { display: flex; gap: 6px; }
  .anchor-popup button { font-size: 11px; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-family: inherit; }
  .anchor-popup .ap-save { background: #1a3d1a; color: #7dc87d; border: 1px solid #2d5c2d; }
  .anchor-popup .ap-clear { background: #3d1a1a; color: #c87d7d; border: 1px solid #5c2d2d; }
  .anchor-popup .ap-cancel { background: #252525; color: #999; border: 1px solid #3a3a3a; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: #2a2a2a; color: #d4d4d4; border: 1px solid #3a3a3a; padding: 9px 16px; border-radius: 4px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; box-shadow: 0 4px 16px rgba(0,0,0,.5); z-index: 100; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-title">
    <h1>환세취호전 KR 패치 에디터</h1>
    <div class="topbar-actions">
      <span class="stats"><svg id="donut" width="16" height="16" viewBox="0 0 36 36" style="vertical-align:middle;margin-right:5px"><circle cx="18" cy="18" r="14" fill="none" stroke="#333" stroke-width="5"/><circle id="donutArc" cx="18" cy="18" r="14" fill="none" stroke="#22c55e" stroke-width="5" stroke-dasharray="0 88" stroke-linecap="round" transform="rotate(-90 18 18)"/></svg><span id="statsText"></span></span>
      <button class="save-btn" id="saveBtn" disabled>저장</button>
      <button class="ghost-btn" id="jpToggle">JP 검색</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <input type="text" id="searchBox" placeholder="검색 (원문/수정)...">
    <label><input type="checkbox" id="filterModified"> 수정된 것만</label>
    <label><input type="checkbox" id="filterProblem"> 문제 있는 것만</label>
    <label><input type="checkbox" id="filterUnlinked"> 연결 안 된 것만</label>
    <span class="prob-nav" id="probNav" style="display:none"><span class="prob-count" id="probCount"></span><button id="probPrev">이전</button><button id="probNext">다음</button></span>
  </div>
</div>

<table>
  <thead><tr>
    <th class="off">OFF</th>
    <th class="orig">원문 (클릭 시 복사)</th>
    <th class="fixed-cell">수정</th>
    <th class="len">Byte</th>
  </tr></thead>
  <tbody id="tbody"></tbody>
</table>

<div id="jpPanel">
  <button id="jpClose">×</button>
  <h3>JP 원문 검색</h3>
  <div class="hint">KR/JP는 원문 순서가 서로 다르게 배치돼 있어(같은 오프셋/인덱스 대응 아님) — 이름·키워드로 찾아서 그 줄의 오프셋을 대사 행의 🔗로 입력. 앵커를 찍으면 그 아래 줄들은 같은 간격으로 자동 대응됨(다음 앵커 전까지).</div>
  <input type="text" id="jpSearchBox" placeholder="이름/키워드로 검색...">
  <div id="jpResults"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SECTIONS = [
  { key: 'dialogue', label: '대사' },
  { key: 'labels', label: '이름/라벨' },
  { key: 'fonts', label: '폰트' },
];
let data = null;
let curSection = 'dialogue';
const modified = {};        // "section:offset" -> fixed string (in-memory unsaved edits)
let problemRows = [];       // currently-rendered rows whose edit is length-invalid
let problemIdx = -1;
// Manual KR<->JP anchors: sparse { krOffset: jpOffset } map. Every dialogue row between one
// anchor and the next gets its JP text auto-filled by walking both dialogue arrays forward
// in lockstep from the anchor (same position delta on both sides) — see
// computeJpTextForKr(). Offsets are plain decimal (matches jp-reference.json).
let anchors = {};
let jpDialogue = [];         // [{offset, text}], sorted by offset (loaded in full once)
let krOffsetToIndex = new Map();
let jpOffsetToIndex = new Map();
let sortedAnchors = [];      // [{krOffset, krIdx, jpOffset, jpIdx}], sorted by krIdx

// Each marker is either a real anchor ({krIdx, jpOffset, jpIdx}) or a "stop" ({krIdx, stop:
// true}) that ends the previous anchor's cascade — see openAnchorPopup()'s "여기서 끊기".
function rebuildSortedAnchors() {
  sortedAnchors = Object.keys(anchors)
    .map((k) => parseInt(k, 10))
    .filter((krOffset) => krOffsetToIndex.has(krOffset))
    .map((krOffset) => {
      const v = anchors[krOffset];
      const krIdx = krOffsetToIndex.get(krOffset);
      if (v === false) return { krOffset, krIdx, stop: true };
      return { krOffset, krIdx, jpOffset: v, jpIdx: jpOffsetToIndex.get(v) };
    })
    .filter((a) => a.stop || a.jpIdx !== undefined)
    .sort((a, b) => a.krIdx - b.krIdx);
}

// Binary search: the last marker whose krIdx <= krIdx, or null before the first marker.
// Markers past this one (by construction, sorted) all have a strictly greater krIdx, so this
// naturally bounds the cascade to "up to but not including the next marker" with no extra check.
function activeMarkerFor(krIdx) {
  let lo = 0, hi = sortedAnchors.length - 1, best = null;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (sortedAnchors[mid].krIdx <= krIdx) { best = sortedAnchors[mid]; lo = mid + 1; }
    else hi = mid - 1;
  }
  return best;
}

// Returns { text, isAnchor, oob } for the JP line this KR offset cascades to, or null if no
// anchor applies (row is before the first marker, or sits at/after a "stop" marker).
function computeJpTextForKr(krOffset) {
  const krIdx = krOffsetToIndex.get(krOffset);
  if (krIdx === undefined) return null;
  const a = activeMarkerFor(krIdx);
  if (!a || a.stop) return null;
  const jpIdx = a.jpIdx + (krIdx - a.krIdx);
  if (jpIdx < 0 || jpIdx >= jpDialogue.length) return { text: '(범위 밖)', isAnchor: krIdx === a.krIdx, oob: true };
  return { text: jpDialogue[jpIdx].text, isAnchor: krIdx === a.krIdx, oob: false };
}

function byteLen(s) {
  // rough CP949 estimate for live feedback; server re-validates exactly. ASCII=1, else=2.
  let n = 0;
  for (const ch of s) n += ch.codePointAt(0) <= 0x7f ? 1 : 2;
  return n;
}
function need(section, e) { return section === 'fonts' ? e.maxLength : e.length; }

// Returns 'ok' | 'over' | 'under' | 'odd' — only 'ok' is saveable. Mirrors the server.
function validity(section, got, n) {
  if (section === 'fonts') return got <= n ? 'ok' : 'over';
  if (section === 'labels') {
    if (got > n) return 'over';
    if ((n - got) % 2 !== 0) return 'odd';
    return 'ok';
  }
  return got === n ? 'ok' : (got > n ? 'over' : 'under');
}
function keyOf(section, e) { return section + ':' + e.offset; }
function currentFixed(section, e) {
  const k = keyOf(section, e);
  return k in modified ? modified[k] : (e.fixed || '');
}

function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return esc(s).replace(/"/g,'&quot;'); }

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

async function load() {
  data = await fetch('/api/translation').then(r => r.json());
  anchors = await fetch('/api/links').then(r => r.json());
  jpDialogue = await fetch('/api/jp-dialogue').then(r => r.json());
  krOffsetToIndex = new Map(data.dialogue.map((e, i) => [e.offset, i]));
  jpOffsetToIndex = new Map(jpDialogue.map((e, i) => [e.offset, i]));
  rebuildSortedAnchors();
  renderTabs();
  render();
}

// Small floating popup (near the clicked 🔗) to type in a JP offset directly — this is the
// whole "linking" UI now; see computeJpTextForKr() for what happens once one is saved.
function openAnchorPopup(btn, krOffset) {
  document.querySelectorAll('.anchor-popup').forEach((p) => p.remove());
  const existing = anchors[krOffset];
  const popup = document.createElement('div');
  popup.className = 'anchor-popup';
  popup.innerHTML = `
    <span class="lbl">JP 오프셋 (jp-reference.json 기준, 10진수)</span>
    <input type="text" inputmode="numeric" placeholder="예: 240108">
    <div class="actions">
      <button class="ap-save">저장</button>
      <button class="ap-stop">여기서 끊기</button>
      <button class="ap-clear">삭제</button>
      <button class="ap-cancel">취소</button>
    </div>
  `;
  document.body.appendChild(popup);
  const rect = btn.getBoundingClientRect();
  popup.style.top = (window.scrollY + rect.bottom + 4) + 'px';
  popup.style.left = (window.scrollX + rect.left) + 'px';

  const input = popup.querySelector('input');
  input.value = typeof existing === 'number' ? String(existing) : '';
  input.placeholder = existing === false ? '(현재: 여기서 끊김)' : '예: 240108';
  input.focus();
  input.select();

  function close() { popup.remove(); document.removeEventListener('mousedown', onOutsideClick, true); }
  function onOutsideClick(ev) { if (!popup.contains(ev.target)) close(); }
  setTimeout(() => document.addEventListener('mousedown', onOutsideClick, true), 0);

  async function commit(jpOffset) {
    try {
      await fetch('/api/anchor', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ krOffset, jpOffset }),
      });
      if (jpOffset === null) delete anchors[krOffset];
      else anchors[krOffset] = jpOffset;
      rebuildSortedAnchors();
      close();
      render();
    } catch (err) { toast('저장 실패: ' + err); }
  }

  popup.querySelector('.ap-save').onclick = () => {
    const v = input.value.trim();
    if (!v) { toast('오프셋을 입력하세요'); return; }
    const n = parseInt(v, 10);
    if (!Number.isFinite(n)) { toast('숫자가 아님'); return; }
    if (!jpOffsetToIndex.has(n)) { toast('jp-reference.json에 없는 오프셋'); return; }
    commit(n);
  };
  // "여기서 끊기": marks this row as a hard stop — the anchor above no longer cascades past
  // it, and this row (and everything after, until the next real anchor) shows empty rather
  // than a guessed/likely-wrong JP line.
  popup.querySelector('.ap-stop').onclick = () => commit(false);
  popup.querySelector('.ap-clear').onclick = () => commit(null);
  popup.querySelector('.ap-cancel').onclick = close;
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') popup.querySelector('.ap-save').click();
    if (ev.key === 'Escape') close();
  });
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  for (const s of SECTIONS) {
    const btn = document.createElement('button');
    const list = data[s.key] || [];
    btn.textContent = `${s.label} (${list.length})`;
    btn.className = s.key === curSection ? 'active' : '';
    btn.onclick = () => { curSection = s.key; render(); };
    tabs.appendChild(btn);
  }
}

function filteredRows() {
  const q = document.getElementById('searchBox').value.trim();
  const modOnly = document.getElementById('filterModified').checked;
  const probOnly = document.getElementById('filterProblem').checked;
  const unlinkedOnly = document.getElementById('filterUnlinked').checked;
  return (data[curSection] || []).filter((e) => {
    const fixed = currentFixed(curSection, e);
    if (q && !e.text.includes(q) && !fixed.includes(q)) return false;
    if (modOnly && !fixed) return false;
    if (probOnly) {
      if (!fixed) return false;
      if (validity(curSection, byteLen(fixed), need(curSection, e)) === 'ok') return false;
    }
    // "연결 안 된 것만": rows the KR<->JP anchor cascade doesn't reach — dialogue only,
    // since anchors only ever apply there (see computeJpTextForKr()).
    if (unlinkedOnly) {
      if (curSection !== 'dialogue') return false;
      if (computeJpTextForKr(e.offset)) return false;
    }
    return true;
  });
}

// Autosize reads scrollHeight (a forced layout). NEVER call it in a loop over all rows —
// the dialogue section has ~14,700 rows and batch-autosizing them freezes the tab (looked
// like "no data"). Only the row being focused/edited is autosized; the rest stay rows=1.
function autosize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

function render() {
  renderTabs();
  const rows = filteredRows();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const e of rows) frag.appendChild(renderRow(e));
  tbody.appendChild(frag);
  recomputeProblems();
  updateStats();
  requestAnimationFrame(updateStickyOffset);
}

function lenCellState(section, e, fixed) {
  const n = need(section, e);
  if (!fixed) return { text: section === 'fonts' ? `0/${n}` : `${n}`, cls: 'empty' };
  const got = byteLen(fixed);
  const v = validity(section, got, n);
  const suffix = section === 'fonts' ? ' 최대' : '';
  return { text: `${got}/${n}${suffix}`, cls: v === 'ok' ? 'ok' : 'bad' };
}

function renderRow(e) {
  const tr = document.createElement('tr');
  const k = keyOf(curSection, e);
  const fixed = currentFixed(curSection, e);

  const tdOff = document.createElement('td');
  tdOff.className = 'off';
  tdOff.textContent = '0x' + e.offset.toString(16);

  const tdOrig = document.createElement('td');
  tdOrig.className = 'orig';
  const origText = document.createElement('div');
  origText.textContent = e.text;
  origText.title = '클릭하여 복사';
  origText.onclick = () => {
    navigator.clipboard && navigator.clipboard.writeText(e.text);
    tdOrig.classList.add('copied');
    setTimeout(() => tdOrig.classList.remove('copied'), 600);
  };
  tdOrig.appendChild(origText);

  // Manual KR<->JP anchor cascade (see computeJpTextForKr() above) — dialogue only, since
  // JP correspondence is only meaningful for story text, not labels/fonts.
  if (curSection === 'dialogue') {
    const marker = anchors[e.offset]; // number (anchor) | false (stop) | undefined
    const isAnchor = typeof marker === 'number';
    const isStop = marker === false;
    const computed = computeJpTextForKr(e.offset);
    const linkRow = document.createElement('div');
    linkRow.className = 'link-row';
    const linkBtn = document.createElement('button');
    linkBtn.className = 'link-anchor' + (isAnchor ? ' anchored' : '') + (isStop ? ' stopped' : '');
    linkBtn.textContent = isStop ? '⛔' : '🔗';
    linkBtn.title = isAnchor ? 'JP 앵커 지정됨 — 다시 눌러 수정/삭제'
      : isStop ? '여기서 끊김 — 다시 눌러 앵커 지정/해제' : '이 줄을 JP 오프셋 앵커로 지정';
    linkBtn.onclick = () => openAnchorPopup(linkBtn, e.offset);
    linkRow.appendChild(linkBtn);

    const jpDiv = document.createElement('div');
    jpDiv.className = 'jp-cascade-text' + (computed && computed.isAnchor ? ' is-anchor' : '') + (computed && computed.oob ? ' oob' : '') + (!computed ? ' empty' : '');
    jpDiv.textContent = computed ? computed.text : (isStop ? '(여기서 끊김)' : '(위쪽에 앵커 없음)');
    linkRow.appendChild(jpDiv);
    tdOrig.appendChild(linkRow);
  }

  const tdFixed = document.createElement('td');
  tdFixed.className = 'fixed-cell';
  const ta = document.createElement('textarea');
  ta.className = 'kr-input';
  ta.rows = 1;
  ta.value = fixed;
  ta.placeholder = e.text;
  ta.dataset.key = k;
  if (k in modified) ta.classList.add('modified');

  // "확정" toggle — marks an entry reviewed with no change needed. Only shown when the
  // fixed field is empty (an actual edit supersedes it). Persists immediately (a bool, no
  // batch), independent of the modified{} text-edit batch.
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'confirm-btn';
  function syncConfirmUI() {
    tr.classList.toggle('confirmed', !!e.confirmed);
    confirmBtn.textContent = e.confirmed ? '취소' : '확정';
    // hide the button whenever the fixed field has content (edit takes precedence)
    confirmBtn.style.display = ta.value ? 'none' : '';
  }
  confirmBtn.addEventListener('click', async () => {
    const next = !e.confirmed;
    confirmBtn.disabled = true;
    try {
      const res = await fetch('/api/confirm', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ section: curSection, offset: e.offset, confirmed: next }),
      }).then((r) => r.json());
      if (res.ok) { e.confirmed = res.confirmed; syncConfirmUI(); updateStats(); }
      else toast('확정 실패');
    } catch (err) { toast('확정 실패: ' + err); }
    confirmBtn.disabled = false;
  });

  const tdLen = document.createElement('td');
  tdLen.className = 'len';

  function refreshLen() {
    const val = ta.value;
    const st = lenCellState(curSection, e, val);
    tdLen.textContent = st.text;
    tdLen.className = 'len ' + st.cls;
    const invalid = val && validity(curSection, byteLen(val), need(curSection, e)) !== 'ok';
    ta.classList.toggle('invalid', !!invalid);
  }

  // NOT .trim()'d anywhere: leading/trailing spaces (half- or full-width 　) are meaningful
  // game content here (right-aligned rank labels, "지옥　다리후리기"-style compounds).
  ta.addEventListener('focus', () => autosize(ta));
  ta.addEventListener('blur', () => { ta.style.height = ''; });
  ta.addEventListener('input', () => {
    // Auto-convert a typed half-width space to the full-width space (U+3000) the game text
    // uses, for dialogue/labels. Skipped for fonts, whose face names use real ASCII spaces
    // ("환세취호전 ver.1.0"). 1-char→1-char so the caret position stays valid.
    if (curSection !== 'fonts' && ta.value.indexOf(' ') >= 0) {
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.replace(/ /g, '　');
      ta.setSelectionRange(s, en);
    }
    const val = ta.value;
    if (val === (e.fixed || '')) { delete modified[k]; ta.classList.remove('modified'); }
    else { modified[k] = val; ta.classList.add('modified'); }
    ta.classList.remove('saved');
    autosize(ta);
    refreshLen();
    syncConfirmUI();
    recomputeProblems();
    updateStats();
    updateSaveBtn();
  });

  refreshLen();
  syncConfirmUI();
  const inner = document.createElement('div');
  inner.className = 'fixed-inner';
  inner.append(ta, confirmBtn);
  tdFixed.appendChild(inner);
  tr.append(tdOff, tdOrig, tdFixed, tdLen);
  return tr;
}

function recomputeProblems() {
  // query only the invalid inputs (cheap) rather than scanning every row's textarea.
  problemRows = Array.from(document.querySelectorAll('#tbody .kr-input.invalid'), (ta) => ta.closest('tr'));
  const nav = document.getElementById('probNav');
  if (problemRows.length) {
    document.getElementById('probCount').textContent = problemRows.length + '건 ';
    nav.style.display = 'inline-flex';
    if (problemIdx >= problemRows.length) problemIdx = problemRows.length - 1;
  } else {
    nav.style.display = 'none';
    problemIdx = -1;
  }
}

function gotoProblem(delta) {
  if (!problemRows.length) return;
  problemIdx = (problemIdx + delta + problemRows.length) % problemRows.length;
  const tr = problemRows[problemIdx];
  document.querySelectorAll('tr.prob-focus').forEach((r) => r.classList.remove('prob-focus'));
  tr.classList.add('prob-focus');
  tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
  const ta = tr.querySelector('.kr-input');
  if (ta) ta.focus();
}

function countModifiedAll() { return Object.keys(modified).length; }
function updateSaveBtn() {
  document.getElementById('saveBtn').disabled = countModifiedAll() === 0;
}

function updateStats() {
  // reviewed = entries that either have an edit (effective fixed) or are marked confirmed
  // (reviewed, no change needed), across ALL sections.
  let total = 0, done = 0;
  for (const s of SECTIONS) {
    for (const e of (data[s.key] || [])) {
      total++;
      if (currentFixed(s.key, e) || e.confirmed) done++;
    }
  }
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('statsText').textContent = `${done} / ${total} (${pct}%)`;
  const circ = 2 * Math.PI * 14;
  document.getElementById('donutArc').setAttribute('stroke-dasharray', `${(circ * done / (total || 1)).toFixed(1)} ${circ.toFixed(1)}`);
}

function updateStickyOffset() {
  const h = document.querySelector('.topbar').offsetHeight;
  document.documentElement.style.setProperty('--topbar-h', h + 'px');
}

async function saveAll() {
  const keys = Object.keys(modified);
  if (!keys.length) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '저장 중...';
  const edits = keys.map((k) => {
    const [section, offStr] = [k.slice(0, k.indexOf(':')), k.slice(k.indexOf(':') + 1)];
    return { key: k, section, offset: parseInt(offStr, 10), fixed: modified[k] };
  });
  let result;
  try {
    result = await fetch('/api/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ edits }),
    }).then((r) => r.json());
  } catch (err) {
    btn.textContent = '저장'; btn.disabled = false;
    toast('저장 실패: ' + err); return;
  }
  let saved = 0, failed = 0;
  for (const [k, res] of Object.entries(result.results || {})) {
    if (res.ok) {
      saved++;
      // commit into in-memory data (server may have padded labels), drop from modified
      const section = k.slice(0, k.indexOf(':'));
      const offset = parseInt(k.slice(k.indexOf(':') + 1), 10);
      const entry = (data[section] || []).find((e) => e.offset === offset);
      if (entry) entry.fixed = res.fixed;
      delete modified[k];
      const ta = document.querySelector(`.kr-input[data-key="${CSS.escape(k)}"]`);
      if (ta) {
        ta.value = res.fixed;
        ta.classList.remove('modified', 'invalid');
        ta.classList.add('saved');
        setTimeout(() => ta.classList.remove('saved'), 1500);
      }
    } else {
      failed++;
    }
  }
  btn.textContent = '저장';
  updateSaveBtn();
  updateStats();
  recomputeProblems();
  toast(failed ? `${saved}건 저장, ${failed}건 실패(길이 안 맞음)` : `${saved}건 저장했습니다.`);
}

document.getElementById('saveBtn').addEventListener('click', saveAll);
document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('filterModified').addEventListener('change', render);
document.getElementById('filterProblem').addEventListener('change', render);
document.getElementById('filterUnlinked').addEventListener('change', render);
document.getElementById('probPrev').addEventListener('click', () => gotoProblem(-1));
document.getElementById('probNext').addEventListener('click', () => gotoProblem(1));

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyS') { e.preventDefault(); saveAll(); }
});
window.addEventListener('beforeunload', (e) => {
  if (countModifiedAll() > 0) { e.preventDefault(); e.returnValue = ''; }
});

// JP search panel
document.getElementById('jpToggle').addEventListener('click', () => document.getElementById('jpPanel').classList.toggle('open'));
document.getElementById('jpClose').addEventListener('click', () => document.getElementById('jpPanel').classList.remove('open'));
let jpTimer = null;
document.getElementById('jpSearchBox').addEventListener('input', (ev) => {
  clearTimeout(jpTimer);
  const q = ev.target.value.trim();
  jpTimer = setTimeout(async () => {
    const results = document.getElementById('jpResults');
    if (!q) { results.innerHTML = ''; return; }
    const res = await fetch('/api/jp-search?q=' + encodeURIComponent(q)).then((r) => r.json());
    results.innerHTML = '';
    const summary = document.createElement('div');
    summary.style.cssText = 'color:#999;font-size:12px;margin-bottom:8px';
    summary.textContent = `대사 ${res.total}건, 이름/라벨 ${res.labelHits.length}건`;
    results.appendChild(summary);

    // No "연결" button anymore — anchors are set by typing an offset into the KR-side 🔗
    // popup, not by picking a JP line directly. Clicking a line just copies its offset
    // (decimal, matching jp-reference.json) so it's easy to paste into that popup.
    function jpLineRow(offset, text, isMatch) {
      const row = document.createElement('div');
      row.className = 'jp-line-row' + (isMatch ? ' match' : '');
      row.title = '클릭하여 오프셋 복사';
      const span = document.createElement('span');
      span.textContent = text;
      const off = document.createElement('span');
      off.className = 'off';
      off.textContent = offset;
      row.onclick = () => {
        navigator.clipboard && navigator.clipboard.writeText(String(offset));
        toast('오프셋 복사됨: ' + offset);
      };
      row.append(span, off);
      return row;
    }

    for (const hit of res.results) {
      const div = document.createElement('div');
      div.className = 'hit';
      for (const l of hit.lines) div.appendChild(jpLineRow(l.offset, l.text, l.isMatch));
      results.appendChild(div);
    }
    if (res.labelHits.length) {
      const div = document.createElement('div');
      div.className = 'hit';
      for (const l of res.labelHits) div.appendChild(jpLineRow(l.offset, l.text, true));
      results.appendChild(div);
    }
  }, 250);
});

window.addEventListener('resize', updateStickyOffset);
load();
</script>
</body>
</html>
