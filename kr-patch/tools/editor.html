<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>환세취호전 KR 패치 에디터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', -apple-system, sans-serif; background: #1e1e1e; color: #d4d4d4; font-size: 14px; padding: 0 16px 40px; transition: padding-right .2s; }
  /* Context panel is position:fixed (so it doesn't scroll away), which means it overlays
     rather than reflows content by default — push the whole page over by the panel's width
     instead so nothing sits underneath it. Kept in sync with #contextPanel.open (see
     showContext()/ctxClose's listener). */
  body.ctx-open { padding-right: 376px; }

  .topbar { position: sticky; top: 0; z-index: 10; background: #181818; padding: 10px 0 8px; border-bottom: 1px solid #333; }
  .topbar-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  h1 { font-size: 15px; font-weight: 600; color: #bbb; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .stats { font-size: 12px; color: #666; display: inline-flex; align-items: center; }
  .save-btn { background: #2e2e2e; color: #ccc; border: 1px solid #4a4a4a; height: 28px; padding: 0 14px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; }
  .save-btn:hover:not(:disabled) { background: #3a3a3a; color: #fff; }
  .save-btn:disabled { background: #1e1e1e; color: #444; border-color: #2a2a2a; cursor: default; }
  .ghost-btn { background: transparent; color: #999; border: 1px solid #3a3a3a; height: 28px; padding: 0 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; transition: background .1s, transform .05s; }
  .ghost-btn:hover { background: #2a2a2a; color: #ddd; border-color: #555; }
  .ghost-btn:active { transform: scale(.95); }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { padding: 5px 12px; background: #252525; border: 1px solid #3a3a3a; color: #aaa; cursor: pointer; border-radius: 4px; font-size: 12px; font-family: inherit; transition: background .1s, transform .05s; }
  .tabs button:hover { background: #2e2e2e; }
  .tabs button:active { transform: scale(.95); }
  .tabs button.active { background: #1e3a5c; color: #7ec4f8; border-color: #3a6a9c; font-weight: 600; }
  .toolbar input[type="text"] { background: #252525; color: #ccc; border: 1px solid #3a3a3a; height: 28px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-family: inherit; }
  .toolbar select { background: #252525; color: #ccc; border: 1px solid #3a3a3a; height: 28px; padding: 0 6px; border-radius: 4px; font-size: 12px; font-family: inherit; }
  #searchBox { width: 280px; }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #888; cursor: pointer; user-select: none; white-space: nowrap; }
  .toolbar label input[type="checkbox"] { accent-color: #999; width: 12px; height: 12px; }
  .unrev-nav { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #666; }
  .unrev-nav button { background: #252525; border: 1px solid #3a3a3a; border-radius: 4px; height: 26px; padding: 0 8px; cursor: pointer; font-size: 12px; color: #999; font-family: inherit; }
  .unrev-nav button:hover { background: #2e2e2e; color: #ccc; }
  .unrev-nav .unrev-count { color: #c04040; font-weight: 600; }
  /* 저장 실패 네비 — 미검토 네비와 같은 구조지만 오류 상태라 항상 눈에 띄게 채워 둔다. */
  .fail-nav { background: #3a1414; border: 1px solid #6a2020; border-radius: 4px; padding: 0 6px 0 10px; }
  .fail-nav .fail-count { color: #ff8080; font-weight: 600; }
  .fail-nav button { background: #4a1a1a; border-color: #6a2020; color: #e0a0a0; }
  .fail-nav button:hover { background: #5a2020; color: #fff; }

  /* "완전 일치" 검색 중 같은 원문(대개 같은 JP에 대응)인 행이 여러 개 잡히면 뜨는 바 —
     한 번 입력해서 전부에 동시 적용(gensei-pc98 에디터의 fill-bar 이식). */
  .fill-bar { background: #1a1a1a; border: 1px solid #2e2e2e; border-radius: 4px; padding: 7px 12px; margin-top: 10px; display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .fill-bar input { flex: 1; background: #252525; border: 1px solid #3a3a3a; color: #d4d4d4; padding: 4px 8px; border-radius: 4px; font-size: 13px; font-family: inherit; }
  .fill-bar input:focus { outline: none; border-color: #555; }
  .fill-bar button { background: #2a2a2a; color: #bbb; border: 1px solid #3a3a3a; padding: 4px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .fill-bar button:hover { background: #333; color: #ddd; }
  .fill-bar .fill-info { color: #666; white-space: nowrap; }

  /* Floating pill, not in document flow — in-flow bars (like .fill-bar above) push the
     whole table down every time they show/hide, which felt laggy for something that
     appears/disappears on every click. Fixed position = no reflow, and it's small/plain
     enough to stay out of the way. */
  #bulkBar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1a1a1a; border: 1px solid #3a3a3a; border-radius: 20px; padding: 6px 8px 6px 14px; display: flex; gap: 8px; align-items: center; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.5); z-index: 60; }
  #bulkBar .fill-info { color: #999; white-space: nowrap; }
  #bulkBar button { background: #2a2a2a; color: #bbb; border: 1px solid #3a3a3a; padding: 4px 10px; border-radius: 14px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  #bulkBar button:hover { background: #333; color: #ddd; }

  /* 고정폭 레이아웃(PC98 방식): table-layout:fixed + 고정 px 컬럼. 브라우저 크기와
     무관하게 컬럼 폭이 일정 — 리사이즈마다 재계산·재배치 없음, 헤더/본문 정렬도 일치.
     OFF 84 + 원문 380 + 수정 412 + Byte 84 = 960 */
  table { width: 960px; border-collapse: collapse; font-size: 13px; table-layout: fixed; margin-top: 10px; }
  th { background: #1a1a1a; padding: 6px 8px; text-align: left; border-bottom: 1px solid #333; font-weight: 600; color: #666; font-size: 11px; position: sticky; top: var(--topbar-h, 84px); z-index: 5; white-space: nowrap; }
  td { padding: 5px 8px; border-bottom: 1px solid #252525; vertical-align: top; }
  tr:hover { background: #232323; }
  tr.unrev-focus { outline: 2px solid #c04040; outline-offset: -2px; }
  /* 저장에 실패해 아직 반영 안 된 행 — 스크롤 중에도 찾을 수 있게 상시 표시한다. */
  tr.save-failed { background: #2a1212 !important; box-shadow: inset 3px 0 0 #c04040; }
  /* Multi-select (gensei-pc98 editor.py 이식): OFF 칸을 두 번 클릭해 범위 선택. */
  tr.row-selected { background: #1a2840 !important; }
  tr.range-start { background: #252000 !important; }
  .off { width: 84px; color: #555; font-family: monospace; font-size: 11px; cursor: pointer; }
  .off-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .bookmark-btn { background: none; border: none; color: #444; cursor: pointer; font-size: 11px; padding: 0; line-height: 1; filter: grayscale(1); opacity: .5; }
  .bookmark-btn:hover { opacity: .85; }
  .bookmark-btn.active { filter: none; opacity: 1; }
  .orig { width: 380px; color: #999; white-space: pre-wrap; word-break: break-all; cursor: pointer; }
  .orig:hover { background: #1e2433; }
  .orig.copied { background: #1a3322; transition: background .1s; }
  .jp-text { color: #6a8fae; font-size: 12px; white-space: pre-wrap; word-break: break-all; margin-top: 6px; cursor: pointer; }
  .jp-text.copied { background: #1a3322; transition: background .1s; }
  /* 행 참고 주석 — 대사 원문/JP 아래에 붙는다. 소스별로 색만 다르고 나머지는 공통:
     note-finding = AI 검토 사유(review-findings.json), note-dup = 중복 JP 처리 제안.
     둘 다 정보 표시일 뿐 자동 적용은 하지 않는다(annotationsFor() 참고). */
  .row-note { font-size: 11px; white-space: pre-wrap; word-break: break-all; margin-top: 6px; }
  .row-note.note-finding { color: #c9a04a; }
  .row-note.note-finding b { color: #e0b95c; }
  .row-note.note-dup { color: #5ec9b0; }
  .row-note.note-dup b { color: #7fe0c8; }
  /* 갈린 확정본의 나머지 후보 — 제안이 아니라 참고라 한 단계 죽여서 표시 */
  .row-note.note-dup-alt { color: #4a8a7c; margin-top: 2px; }
  .row-note.note-dup-alt b { color: #5ea593; }
  /* 수정칸 = [입력 textarea][확정 버튼] flex 행. 버튼은 절대위치로 겹치지 않고 옆에
     붙는다. 버튼이 숨으면(수정칸에 내용 있으면) textarea가 전체 폭을 차지. */
  .fixed-cell { width: 412px; }
  .fixed-inner { display: flex; align-items: flex-start; gap: 6px; }
  /* resize:vertical (not JS-driven autosize, which forced a layout read on every
     keystroke) — most dialogue text fits one row anyway; drag to expand for the rare
     wrapped line instead of resizing automatically. */
  .kr-input { flex: 1; min-width: 0; background: #252525; color: #d4d4d4; border: 1px solid #3a3a3a; padding: 4px 7px; border-radius: 4px; font-size: 13px; font-family: inherit; resize: vertical; overflow-y: auto; line-height: 1.5; }
  .kr-input:focus { border-color: #666; outline: none; }
  .kr-input.modified { border-color: #b87820; background: #1e1600; }
  .kr-input.saved { border-color: #2a8040; }
  .kr-input.invalid { border-color: #c04040; background: #1e0d0d; }
  /* Cheap stand-in for .kr-input shown by default — one <textarea> per row × ~14,800 rows
     was the editor's main weight, so rows render this div and upgrade to a real textarea
     only when clicked (see renderRow's upgradeToTextarea()). Visually mirrors .kr-input. */
  .kr-display { flex: 1; min-width: 0; background: #252525; color: #d4d4d4; border: 1px solid #3a3a3a; padding: 4px 7px; border-radius: 4px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; cursor: text; min-height: 26px; }
  .kr-display.placeholder { color: #555; }
  .kr-display.modified { border-color: #b87820; background: #1e1600; }
  .kr-display.saved { border-color: #2a8040; }
  .kr-display.invalid { border-color: #c04040; background: #1e0d0d; }
  /* 확정(수정 없이 검수 완료) 토글 — 수정칸이 비어 있을 때만 표시 */
  .confirm-btn { flex: none; background: #252525; color: #777; border: 1px solid #3a3a3a; height: 26px; padding: 0 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: inherit; white-space: nowrap; }
  .confirm-btn:hover { background: #2e2e2e; color: #aaa; }
  tr.confirmed .kr-input { background: #152015; border-color: #2a452a; }
  tr.confirmed .kr-input::placeholder { color: #4a7a4a; }
  tr.confirmed .kr-display { background: #152015; border-color: #2a452a; }
  tr.confirmed .kr-display.placeholder { color: #4a7a4a; }
  tr.confirmed .confirm-btn { background: #1a3d1a; color: #7dc87d; border-color: #2d5c2d; }
  tr.confirmed .confirm-btn:hover { background: #234d23; }
  .len { width: 84px; text-align: center; color: #555; font-size: 12px; white-space: nowrap; }
  .len.ok { color: #408040; }
  .len.bad { color: #c04040; font-weight: bold; }
  .len.empty { color: #3a3a3a; }
  tr.jump-focus { outline: 2px solid #7ec4f8; outline-offset: -2px; }

  /* Context panel: shows the focused row's neighbors (in original-file order — same array
     index adjacency as translation.json's dialogue list) so a reviewer editing a line
     doesn't have to clear filters and hunt for what comes before/after it. Opens on
     textarea focus (see showContext() in the script), stays open until manually closed so
     clicking into it to copy text doesn't make it vanish. */
  /* #ctxRows (not #contextPanel) is the scroll container — the infinite-scroll logic in
     onContextScroll() needs a stable element to read scrollTop/scrollHeight off of, and
     h3/close-button need to stay put above it rather than scrolling away with the rows. */
  #contextPanel { position: fixed; right: 0; top: 0; bottom: 0; width: 360px; background: #202020; border-left: 1px solid #3a3a3a; padding: 12px; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .2s; z-index: 50; box-shadow: -4px 0 20px rgba(0,0,0,.4); }
  #contextPanel.open { transform: translateX(0); }
  .ctx-header { display: flex; align-items: center; justify-content: space-between; flex: none; margin-bottom: 10px; }
  #contextPanel h3 { font-size: 13px; color: #ccc; }
  #ctxClose { background: none; border: none; color: #888; font-size: 16px; cursor: pointer; }
  /* Scroll still works (wheel/trackpad/keyboard) — just the scrollbar chrome is hidden,
     since this panel is read-only reference material, not something you drag a thumb in. */
  #ctxRows { flex: 1; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
  #ctxRows::-webkit-scrollbar { display: none; }
  .ctx-row { padding: 8px; border-radius: 4px; margin-bottom: 6px; font-size: 12px; }
  .ctx-row .ctx-off { color: #556; font-size: 10px; margin-bottom: 3px; }
  .ctx-row .ctx-kr { color: #999; white-space: pre-wrap; word-break: break-all; }
  .ctx-row .ctx-fixed { color: #d4a017; white-space: pre-wrap; word-break: break-all; margin-top: 2px; }
  .ctx-row .ctx-jp { color: #6a8fae; white-space: pre-wrap; word-break: break-all; margin-top: 2px; }
  .ctx-row.current { background: #2a2a2a; border: 1px solid #4a4a4a; }
  .ctx-row.current .ctx-kr { color: #d4d4d4; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: #2a2a2a; color: #d4d4d4; border: 1px solid #3a3a3a; padding: 9px 16px; border-radius: 4px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; box-shadow: 0 4px 16px rgba(0,0,0,.5); z-index: 100; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-title">
    <h1>환세취호전 KR 패치 에디터</h1>
    <div class="topbar-actions">
      <span class="stats"><svg id="donut" width="16" height="16" viewBox="0 0 36 36" style="vertical-align:middle;margin-right:5px"><circle cx="18" cy="18" r="14" fill="none" stroke="#333" stroke-width="5"/><circle id="donutArc" cx="18" cy="18" r="14" fill="none" stroke="#22c55e" stroke-width="5" stroke-dasharray="0 88" stroke-linecap="round" transform="rotate(-90 18 18)"/></svg><span id="statsText"></span></span>
      <button class="save-btn" id="saveBtn" disabled>저장</button>
      <button class="ghost-btn" id="buildInjectBtn" title="번역 반영 → HWANSE.EXE 빌드 → 테스트용 디스크 이미지에 삽입 (docs/final-shared.img는 안 건드림)">빌드 및 삽입</button>
      <button class="ghost-btn" id="deployBtn" title="테스트 이미지를 docs/final-shared.img로 복사 후 커밋 (푸시는 안 함)">배포</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <input type="text" id="searchBox" placeholder="검색 (원문/수정/JP)...">
    <label><input type="checkbox" id="filterExact"> 완전 일치</label>
    <label><input type="checkbox" id="filterUnreviewed"> 미검토</label>
    <select id="filterSelect"></select>
    <input type="text" id="jumpBox" placeholder="오프셋으로 이동..." style="width:140px">
    <button class="ghost-btn" id="jumpBtn">이동</button>
    <button class="ghost-btn" id="bookmarkBtn" title="지정해둔 책갈피로 이동">책갈피</button>
    <label title="꺼두면 행 편집칸에 포커스해도 맥락 패널이 자동으로 열리지 않음 — × 버튼으로 닫아도 다음 포커스에 다시 열리는 게 불편할 때 사용"><input type="checkbox" id="ctxAutoToggle" checked> 맥락 자동표시</label>
    <span class="unrev-nav" id="unrevNav" style="display:none"><span class="unrev-count" id="unrevCount"></span><button id="unrevPrev">이전</button><button id="unrevNext">다음</button></span>
    <span class="unrev-nav fail-nav" id="failNav" style="display:none" title="저장에 실패해 아직 반영되지 않은 행으로 이동 (필터·검색과 무관하게 항상 보인다)"><span class="fail-count" id="failCount"></span><button id="failPrev">이전</button><button id="failNext">다음</button></span>
  </div>
</div>

<div class="fill-bar" id="fillBar" style="display:none">
  <span class="fill-info" id="fillInfo"></span>
  <input type="text" id="fillInput" placeholder="수정 입력...">
  <button id="fillApply">전체 적용</button>
</div>

<div id="bulkBar" style="display:none">
  <span class="fill-info" id="bulkCount"></span>
  <button id="bulkCopyJp">JP 복사</button>
  <button id="bulkConfirm" title="수정 없이 전체 확정 처리 (이미 수정칸에 값이 있는 행은 건너뜀)">일괄 확정</button>
  <button id="bulkCancel">선택 해제</button>
</div>

<table>
  <thead><tr>
    <th class="off">OFF</th>
    <th class="orig">원문 (클릭 시 복사)</th>
    <th class="fixed-cell">수정</th>
    <th class="len">Byte</th>
  </tr></thead>
  <tbody id="tbody"></tbody>
</table>

<div id="contextPanel">
  <div class="ctx-header">
    <h3>맥락 (원문 순서 기준)</h3>
    <button id="ctxClose">×</button>
  </div>
  <div id="ctxRows"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SECTIONS = [
  { key: 'dialogue', label: '대사' },
  { key: 'labels', label: '레이블' },
];
let data = null;
let curSection = 'dialogue';
const modified = {};        // "section:offset" -> fixed string (in-memory unsaved edits)
let unreviewedOffsets = [];    // offsets of filtered rows with no fixed/confirmed yet
let unreviewedIdx = -1;
// 서버가 거부한(주로 바이트 길이 불일치) 편집들 — saveAll()이 매 저장마다 통째로 갱신한다.
// 실패한 편집은 modified{}에 그대로 남아 다음 저장에 재시도되므로, 이 목록도 그때 다시
// 계산되면 해결된 것은 자연히 빠진다. [{ key, section, offset, error }]
let saveFailures = [];
let saveFailureIdx = -1;
// offset -> index in data.dialogue, for the context panel's "neighbors in original-file
// order" lookup (see showContext()). translation.json's jp/jpOffset fields (baked once by
// bake-jp.js, see NOTES.md) already carry the resolved KR<->JP correspondence — no
// client-side anchor computation needed anymore.
let dialogueIndexByOffset = new Map();
// Multi-select (gensei-pc98 editor.py 이식): two-click range select on the OFF column.
// First click sets rangeStart (an index into the currently-rendered row order, same order
// filteredRows() produces — stable between the two clicks since neither filters nor search
// change in between); second click selects everything between the two as a range.
let selection = new Set();
let rangeStart = null;
// Single-slot bookmark: an offset the reviewer explicitly marks via each row's 🔖 button
// (see renderRow()) — deliberately NOT tied to editing/focus, since review jumps around
// non-linearly and the point is marking "covered up to here" on demand. The "책갈피" toolbar
// button jumps to it; null until either the server has one or one is set this session.
let bookmarkOffset = null;

// 맥락 패널 자동표시 on/off (persisted — see ctxAutoToggle listener near the bottom). Default
// true keeps existing behavior (focus a dialogue row -> panel pops open); when false, focus
// no longer forces it open, only the toolbar checkbox/manual showContext() calls do. Doesn't
// affect the panel's own × close button, which always just hides the current view.
let ctxAutoShow = localStorage.getItem('suikoCtxAuto') !== '0';

// Rubric-driven LLM review pass results (review-findings.json, see NOTES.md) — one entry
// per {offset, category: 'meaning'|'punct'|'tone', reason}. 예전에는 이걸 'ai-<category>'
// 드롭다운 필터로도 썼지만 세 카테고리 모두 전량 해결(수정 또는 확정)되어 필터는 제거했다.
// 남은 용도는 행 참고 주석(annotationsFor()) 하나뿐 — 아직 미해결인 사유가 있으면 그 행
// 아래에 표시된다. 필터가 다시 필요해지면 FILTERS 레지스트리에 한 줄 추가하면 된다.
let findingByOffset = new Map();
const FINDING_CATEGORY_LABEL = { meaning: '의미 왜곡', punct: '문장부호 과잉', tone: '화자 말투 불일치' };

function byteLen(s) {
  // rough CP949 estimate for live feedback; server re-validates exactly. ASCII=1, else=2.
  let n = 0;
  for (const ch of s) n += ch.codePointAt(0) <= 0x7f ? 1 : 2;
  return n;
}
function need(section, e) { return e.length; }

// Returns 'ok' | 'over' | 'under' | 'odd' — only 'ok' is saveable. Mirrors the server.
function validity(section, got, n) {
  if (section === 'labels') {
    if (got > n) return 'over';
    if ((n - got) % 2 !== 0) return 'odd';
    return 'ok';
  }
  return got === n ? 'ok' : (got > n ? 'over' : 'under');
}
function keyOf(section, e) { return section + ':' + e.offset; }
function currentFixed(section, e) {
  const k = keyOf(section, e);
  return k in modified ? modified[k] : (e.fixed || '');
}

function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return esc(s).replace(/"/g,'&quot;'); }

// Debounce: returns a wrapped fn that only actually runs `delay`ms after the last call —
// used to keep expensive whole-dataset work (full re-render, stats over ~15,000 entries)
// off the hot path of every single keystroke, which is what was making typing feel laggy.
function debounce(fn, delay) {
  let timer = null;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}
// recomputeUnreviewed()/updateStats() are hoisted function declarations, safe to reference
// here even though they're defined further down.
const scheduleStatsUpdate = debounce(() => { recomputeUnreviewed(); updateStats(); renderFilterSelect(); }, 200);

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// 모든 필터의 "남은 건수"를 한 번의 전체 순회로 계산한다 — value -> count.
// 예전에는 renderFilterSelect()가 옵션마다 따로 전체를 훑어서 필터 수 × 14,800행이었고,
// 필터를 추가할 때마다 렌더가 그만큼 느려졌다. 판정 횟수 자체는 같지만 순회는 1회로 끝난다.
function filterRemainingCounts() {
  const counts = new Map(FILTERS.map((f) => [f.value, 0]));
  for (const e of data.dialogue) {
    const fixed = currentFixed('dialogue', e);
    for (const filter of FILTERS) {
      if (isReviewedFor(filter, e, fixed)) continue;
      if (filter.test(fixed, e)) counts.set(filter.value, counts.get(filter.value) + 1);
    }
  }
  return counts;
}

// Rebuilds the dropdown with a live "남은 건수" count on every option — recomputed on every
// render() so the count visibly drops as the reviewer works through a category, instead of
// staying frozen at the load-time total. Preserves the current selection across rebuilds.
// 계열(FILTERS의 group)은 라벨 접두사가 아니라 <optgroup>으로 표현한다 — 예전에는 dup-*만
// 라벨에 "중복JP:"를 달고 나머지는 안 달아서 한 목록에 낱개와 묶음이 섞여 있었다.
// 건수가 0이 된 옵션은 목록에서 아예 빼되(전량 해결된 계열이 계속 남지 않게), 현재 선택된
// 것만은 0이어도 남긴다 — 마지막 행을 수정/확정하는 순간 드롭다운이 선택을 앗아가지 않도록.
// optgroup은 살아남은 항목이 처음 나올 때 만들므로 빈 그룹은 생기지 않는다.
function renderFilterSelect() {
  const sel = document.getElementById('filterSelect');
  const prev = sel.value;
  const counts = filterRemainingCounts();
  sel.innerHTML = '';
  const none = document.createElement('option');
  none.value = '';
  none.textContent = '필터 없음';
  sel.appendChild(none);
  let group = null, groupName = null;
  for (const f of FILTERS) {
    const n = counts.get(f.value);
    if (n === 0 && f.value !== prev) continue;
    if (!group || f.group !== groupName) {
      groupName = f.group;
      group = document.createElement('optgroup');
      group.label = groupName;
      sel.appendChild(group);
    }
    const o = document.createElement('option');
    o.value = f.value;
    o.textContent = `${f.label} (${n})`;
    group.appendChild(o);
  }
  sel.value = prev;
}

async function load() {
  data = await fetch('/api/translation').then(r => r.json());
  dialogueIndexByOffset = new Map(data.dialogue.map((e, i) => [e.offset, i]));
  bookmarkOffset = await fetch('/api/bookmark').then(r => r.json()).then((b) => b.offset);
  const findings = await fetch('/api/findings').then(r => r.json()).catch(() => []);
  findingByOffset = new Map(findings.map((f) => [f.offset, f]));
  computeDupSuggestions();
  renderTabs();
  render();
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  for (const s of SECTIONS) {
    const btn = document.createElement('button');
    const list = data[s.key] || [];
    btn.textContent = `${s.label} (${list.length})`;
    btn.className = s.key === curSection ? 'active' : '';
    btn.onclick = () => {
      curSection = s.key;
      selection.clear();
      rangeStart = null;
      updateBulkBar();
      render();
    };
    tabs.appendChild(btn);
  }
}

// 문장부호 의심 (see kr-patch/tools/find-punct-issues.js for the CLI/batch version this
// mirrors). 「」 vs 『』 is a KR/JP quote *convention* difference, not a translation error, so
// it's excluded — only ！？… count as "tone marks" here.
const PUNCT_REPEAT_SET = new Set(['！', '？', '…', '、', '，', '。', '．', '「', '」', '『', '』', '～', '∼']);
const PUNCT_TONE_SET = new Set(['！', '？', '…']);

// 문자별 최대 연속 반복 길이. { '！': 2, '…': 3 } 형태.
function punctRuns(s) {
  const m = {};
  const c = [...s];
  for (let i = 0; i < c.length; i++) {
    if (!PUNCT_REPEAT_SET.has(c[i])) continue;
    let j = i;
    while (j < c.length && c[j] === c[i]) j++;
    m[c[i]] = Math.max(m[c[i]] || 0, j - i);
    i = j - 1;
  }
  return m;
}

// 한 줄을 정확히 하나의 문장부호 결함 범주로 분류한다(해당 없으면 null). 예전에는 "반복"과
// "어조 편측"이 각각 독립 조건이라 523건 중 328건이 양쪽 필터에 동시에 잡혔고 — 한 필터를
// 다 훑어도 다른 필터에서 같은 줄이 또 나와 진도가 안 나갔다. 상호배타 + 심각도 순으로 정리:
//   added-repeat: JP에 없는 어조 문자를 KR이 넣고 반복까지 함 (가장 확실한 과잉)
//   added:        JP에 없는 어조 문자를 KR이 넣음 (반복은 없음) — 필터로는 노출 안 함, 아래 참고
//   amplified:    JP에도 있는 문자지만 KR이 JP보다 더 길게 반복 (JP ！ → KR ！！)
// 위에서부터 먼저 걸리는 하나만 반환하므로 세 범주의 교집합은 항상 0이다.
// 'added'는 한때 별도 필터였으나 드롭다운에서 뺐다 — 규칙이 바뀌어서가 아니라(GUIDE.md 2-3의
// "JP에 없는 부호 추가는 교정 대상"은 그대로 유효하다) 필터로서 쓸모가 없어서다: 1,400건대는
// 후보를 좁혀준다고 할 수 없어 전체를 그냥 훑는 것과 다를 바 없고, 우선순위도 낮으며, 어차피
// 다른 대사를 고치는 김에 같이 처리되는 종류다. punctCategory()는 여전히 'added'를 분류하므로
// 필요해지면 FILTERS 레지스트리에 한 줄 되살리는 것으로 끝난다.
function punctCategory(fixed, e) {
  const kr = fixed || e.text;
  const jp = e.jp || '';
  if (!kr || !jp) return null;
  const rk = punctRuns(kr), rj = punctRuns(jp);
  const jpTone = new Set([...jp].filter((c) => PUNCT_TONE_SET.has(c)));
  const added = [...new Set([...kr].filter((c) => PUNCT_TONE_SET.has(c)))].filter((c) => !jpTone.has(c));
  if (added.some((c) => rk[c] >= 2)) return 'added-repeat';
  if (added.length) return 'added';
  if (Object.keys(rk).some((c) => rk[c] > (rj[c] || 1))) return 'amplified';
  return null;
}

// KR/JP 끝 글자가 둘 다 어조 문자인데 서로 다름(느낌표↔물음표 등).
function punctLastMismatch(fixed, e) {
  const kr = fixed || e.text;
  const jp = e.jp || '';
  if (!kr || !jp) return false;
  const krLast = kr.replace(/　+$/u, '').slice(-1);
  const jpLast = jp.replace(/　+$/u, '').slice(-1);
  return PUNCT_TONE_SET.has(krLast) && PUNCT_TONE_SET.has(jpLast) && krLast !== jpLast;
}

// 더듬음 공백(GUIDE.md 2-6) 판정기는 전량 해결되어 드롭다운에서 뺐고, 함수도 지웠다 —
// 같은 로직이 kr-patch/tools/find-punct-issues.js 카테고리 D에 그대로 있어서 배치로 다시
// 훑을 수 있기 때문이다. 아래 mistrans-* 판정기들은 그런 사본이 없어 남겨 두었다.

// ── 연결 해제된 판정기: 오역 의심 (mistrans-*) ─────────────────────────────────
// 문장부호 필터가 "표면 표기"(3층위 ③)를 잡는다면, 이쪽은 "뜻이 틀림"(①)을 기계적으로
// 잡는다. 언어와 무관하게 대조 가능한 신호만 쓴다 — 숫자, 좌우/상하 같은 대립쌍, 고유명사
// 존재 여부, 분량. 의미 판단이 필요한 건 애초에 기계로 못 잡으니 시도하지 않는다.
//
// 넷 다 현재 0건(전량 해결)이라 FILTERS에서 뺐다. 드롭다운은 0건 옵션을 어차피 숨기지만,
// 등록돼 있으면 렌더마다 14,800행 × 판정 비용을 계속 치르기 때문이다(특히 mistransDirection은
// 행마다 정규식 5쌍을 돌린다). 함수를 지우지 않고 남기는 이유는 실제로 결함을 잡은 이력이
// 있고(아래 각 주석의 사례) 저장소 안에 다른 사본이 없어서다. 번역이 크게 갱신된 뒤 다시
// 훑고 싶으면 FILTERS에 한 줄씩 되살리면 된다.

// JP·KR 양쪽의 아라비아 숫자(전각 포함)를 정규화해 집합으로 비교. 한쪽에만 숫자가 있는
// 경우는 제외 — JP 한자 수사(１度→"한번", 三人→"세명")를 KR이 우리말로 풀어 쓴 정상 번역이
// 대부분이라 그것까지 잡으면 오탐이 압도적이다. 양쪽 다 숫자로 적었는데 값이 다르면 진짜
// 오류(실제로 ２００Ｇ→２０００Ｇ 10배 오기가 이 조건으로 걸렸다).
function mistransNumber(fixed, e) {
  const kr = fixed || e.text;
  const jp = e.jp || '';
  if (!kr || !jp) return false;
  const digits = (s) => (s.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .match(/\d+/g) || []).map(Number).sort((a, b) => a - b).join(',');
  const a = digits(jp), b = digits(kr);
  return !!a && !!b && a !== b;
}

// 대립쌍이 뒤집힌 경우. JP에 A쪽만 있는데 KR엔 B쪽 표현만 있으면(또는 그 반대) 반전으로 본다.
// 토큰을 좁게 잡는 게 핵심 — 예전에 '勝'(→勝手にの 勝까지 매칭)·'지'(어미 "-지"에 전부 매칭)
// 같은 헐거운 토큰을 쓰니 오탐이 대부분이었다. 실제로 좌우가 통째로 뒤바뀐 튜토리얼 지시문
// (KR "오른쪽으로" ← JP 左側に)이 이 조건으로 발견됐다.
const MISTRANS_PAIRS = [
  ['降りる|下りる|降ろ', ['내려', '내리'], '登る|上がる|上る|昇', ['올라', '올리']],
  ['売っ|売る|売り|売ら', ['팔', '파시', '판매'], '買っ|買う|買い|買わ', ['사시', '삽니', '구입']],
  ['死ん|死ぬ|死に', ['죽'], '生きて|生きる', ['살아']],
  ['右', ['오른'], '左', ['왼']],
  ['前に進|進む', ['앞으로', '전진'], '戻る|引き返', ['돌아', '되돌']],
];
function mistransDirection(fixed, e) {
  const kr = fixed || e.text;
  const jp = e.jp || '';
  if (!kr || !jp) return false;
  for (const [jpA, krA, jpB, krB] of MISTRANS_PAIRS) {
    const hasA = new RegExp(jpA).test(jp), hasB = new RegExp(jpB).test(jp);
    const krHasA = krA.some((k) => kr.includes(k)), krHasB = krB.some((k) => kr.includes(k));
    if (hasA && !hasB && krHasB && !krHasA) return true;
    if (hasB && !hasA && krHasA && !krHasB) return true;
  }
  return false;
}

// JP가 등장인물을 이름으로 부르는데 KR엔 그 이름이 없는 경우. 한국어가 이름 대신 "자네/
// 아저씨"를 쓰는 건 자연스러운 현지화라 전부가 결함은 아니지만, 이름이 통째로 증발하면서
// 문장 뜻까지 바뀐 사례(JP アターホーをいたく → KR "강한 연심을")가 이 조건으로 걸린다.
const MISTRANS_NAMES = [
  ['アターホー', '아타호'], ['スマッシュ', '스마슈'], ['リンシャン', '린샹'],
  ['ダリオス', '다리오스'], ['サスケ', '사스케'], ['ミンメイ', '민메이'],
  ['シュリ', '슈리'], ['メイメイ', '메이메이'], ['トウコツ', '도올'],
];
function mistransName(fixed, e) {
  const kr = fixed || e.text;
  const jp = e.jp || '';
  if (!kr || !jp) return false;
  return MISTRANS_NAMES.some(([j, k]) => jp.includes(j) && !kr.includes(k));
}

// JP 대비 KR 분량이 절반 이하 — 원문의 절(節) 하나가 통째로 빠졌을 가능성. 공백·문장부호를
// 제외한 실질 글자 수로 비교하고, 짧은 줄(감탄사 등)은 비율이 튀기 쉬워 JP 8자 이상만 본다.
// 2.0배로 낮추면 175건까지 늘어나는데 정상적인 압축 번역이 섞여 2.5배로 좁혔다.
function mistransLength(fixed, e) {
  const kr = fixed || e.text;
  const jp = e.jp || '';
  if (!kr || !jp) return false;
  const vlen = (s) => [...s.replace(/[　\s「」『』！？…，、。．]/g, '')].length;
  const a = vlen(jp), b = vlen(kr);
  return a >= 8 && b > 0 && a / b >= 2.5;
}

// ── 중복 JP 처리 제안 (dup-*) ────────────────────────────────────────────────
// 미확정(수정도 확정도 안 된) 대사 중, 문장부호·기호·공백을 뺀 JP 원문이 이미 확정
// (confirmed) 또는 수정(fixed)된 다른 대사와 같은 것들을 찾아 제안한다. 자동으로 쓰지는
// 않는다 — 화자·장면 톤이 갈리면 같은 JP라도 번역이 달라야 하는 경우가 있어서(번역
// 워크플로우 문서 §2.3 참고), 반영은 사람이 직접 확인하고 진행한다. load()에서 한 번
// 계산한 스냅샷이고, 세션 중 데이터가 바뀌어도(다른 행을 확정/수정해도) 다시 계산하지
// 않는다 — 그래도 각 필터 자체는 fixed/confirmed된 행을 그때그때 제외하므로(passesFilters)
// 진행하면서 남은 건수는 정상적으로 줄어든다.
const DUP_STRIP_RE = /[　「」『』…？！～（）－／＆○☆→←↓、：％〒]/g;
function dupNormJp(jp) { return (jp || '').replace(DUP_STRIP_RE, ''); }

let dupSuggestionByOffset = new Map(); // offset -> {type, agreed, agreedCount, need, got}

function computeDupSuggestions() {
  dupSuggestionByOffset = new Map();
  const groups = new Map();
  for (const e of data.dialogue) {
    const key = dupNormJp(e.jp);
    if (!key) continue;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  }
  const isDecided = (e) => !!e.confirmed || !!(e.fixed && e.fixed.length);
  const finalKR = (e) => (e.fixed && e.fixed.length) ? e.fixed : e.text;

  for (const entries of groups.values()) {
    if (entries.length < 2) continue;
    const decided = entries.filter(isDecided);
    const undecided = entries.filter((e) => !isDecided(e));
    if (!decided.length || !undecided.length) continue;

    // 확정본이 여러 갈래일 수 있다(같은 JP를 장면마다 달리 옮겼거나, 같은 번역인데 슬롯
    // 패딩만 다르거나). 득표순으로 정렬하되 **후보 전체를 들고 간다** — 예전에는 1등 하나만
    // 남기고 버렸는데, 동률이면 1등이 삽입 순서에 따라 임의로 정해지는 데다, 그렇게 고른
    // 후보의 길이가 안 맞으면 정작 슬롯에 딱 맞는 다른 확정본이 있는데도 "그대로 못 넣음"
    // 으로 처리했다(실측 56행).
    // 후보마다 KR 확정값·건수와 함께 **그 값을 낸 확정행의 JP 원문**을 들고 간다. 그룹핑은
    // 문장부호를 지우고 묶으므로(요청 사양) 한 그룹 안에 JP가 미묘하게 다른 줄이 섞인다 —
    // 특히 `…！？`를 지우는 탓에 감탄문과 의문문이 같은 그룹이 된다. 출처를 안 보고 고르면
    // JP가 `？`로 끝나는 줄에 `！`로 끝나는 번역을 제안하게 되는데(실제 사례: 1358600),
    // 그건 GUIDE 2-3이 2순위 결함으로 규정한 "끝 마크 종류 불일치"를 도구가 만들어내는 꼴이다.
    const byValue = new Map(); // KR 확정값 -> { count, jps:Set }
    for (const e of decided) {
      let c = byValue.get(finalKR(e));
      if (!c) byValue.set(finalKR(e), c = { count: 0, jps: new Set() });
      c.count++;
      c.jps.add(e.jp);
    }
    const candidates = [...byValue.entries()]
      .map(([value, c]) => ({ value, count: c.count, jps: c.jps }))
      .sort((a, b) => b.count - a.count);
    if (candidates.length > 1 && candidates[1].count >= 2) {
      // 서로 다른 확정 번역이 각각 2건 이상씩 존재 — 어느 쪽이 맞는지 기계적으로 판단 못
      // 하므로 이 그룹은 제안하지 않고 건너뛴다.
      continue;
    }
    const unanimous = candidates.length === 1;
    for (const e of undecided) {
      // 고르는 우선순위 (같은 조건이면 확정 건수가 많은 쪽 — candidates가 득표순 정렬):
      //   ① JP 원문이 이 행과 완전히 같고 + 슬롯 바이트도 맞음
      //   ② JP 원문이 같음 (길이는 안 맞아도 출처가 확실하니 이쪽이 낫다)
      //   ③ 슬롯 바이트가 맞음 (JP는 다름)
      //   ④ 최다 득표
      const fits = (c) => byteLen(c.value) === e.length;
      const sameJp = (c) => c.jps.has(e.jp);
      const chosen = candidates.find((c) => sameJp(c) && fits(c))
        || candidates.find(sameJp)
        || candidates.find(fits)
        || candidates[0];
      const agreed = chosen.value, agreedCount = chosen.count;
      const others = candidates.filter((c) => c !== chosen).map((c) => c.value);
      // 출처 JP가 이 행의 JP와 다르면 그 원문을 같이 넘겨 주석에 드러낸다 — 끝 부호가
      // 갈린 경우를 눈으로 잡을 수 있어야 한다.
      const srcJp = sameJp(chosen) ? null : [...chosen.jps][0];
      if (agreed === e.text) {
        dupSuggestionByOffset.set(e.offset, { type: 'confirm', agreed, agreedCount, others, srcJp });
      } else {
        const gotLen = byteLen(agreed);
        // 'strong'은 확정본이 **전원 일치**하고 2건 이상이며 **출처 JP까지 같을** 때만.
        const type = gotLen === e.length
          ? (unanimous && agreedCount >= 2 && !srcJp ? 'strong' : 'weak')
          : 'length';
        dupSuggestionByOffset.set(e.offset, { type, agreed, agreedCount, need: e.length, got: gotLen, others, srcJp });
      }
    }
  }
}

// ── 필터 레지스트리 ─────────────────────────────────────────────────────────
// 드롭다운에 뜨는 모든 필터의 단일 정의. 예전에는 punct-*/mistrans-*(라이브 판정 함수),
// ai-*(review-findings.json의 Set), dup-*(스냅샷 Map)이 각각 다른 자료구조라
// 건수 계산과 행 필터 양쪽에 계열별 분기가 똑같이 중복돼 있었고,
// "이미 검토됨" 제외 규칙도 분기마다 따로 적혀 있었다. 계열을 하나 늘리려면 두 곳을 같이
// 고쳐야 했고 라벨 표기법도 계열마다 제각각이었다. 이제 한 필터가 갖는 모든 것을 여기서
// 선언하고, 판정하는 쪽은 계열을 구분하지 않는다:
//   value  드롭다운 value (= 필터 식별자). 접두사는 group과 1:1.
//   group  <optgroup> 이름. FILTERS는 group끼리 붙어 있는 순서로 유지한다.
//   label  그룹 안에서의 항목 이름 (그룹명을 라벨에 중복해 넣지 않는다)
//   test   (fixed, e) => boolean. 이 행이 후보인가. 계열 무관 동일 시그니처.
//
// 필터의 역할은 "남은 일감 찾기"가 아니라 **같은 기계적 판단을 묶어 처리하기**다. 미검토가
// 5,000건대로 줄어 어차피 전수로 훑는 단계이고, 실측상 전체 필터를 합쳐도 미검토의 20%밖에
// 못 덮는다(나머지 80%는 어떤 조건에도 안 걸린다). 그래서 전량 해결되어 0건이 된 조건들은
// 뺐다(아래 "연결 해제된 판정기" 참고).
//
// 중복 JP의 "참고(길이 불일치)"는 제안값을 바이트가 안 맞아 그대로는 못 넣는 줄이라 한때
// 주석 전용으로 뺐다가 되살렸다 — 그대로 못 넣을 뿐 동형 대사의 확정 번역이 붙어 있는 줄
// 이라, 그걸 참고해 길이에 맞춰 고쳐 쓰는 작업 자체가 하나의 묶음이기 때문이다. 훑다가
// 만나기를 기다리는 것보다 모아서 처리하는 편이 낫다.
const FILTERS = [
  { value: 'punct-added-repeat', group: '문장부호', label: '추가+반복',      test: (f, e) => punctCategory(f, e) === 'added-repeat' },
  { value: 'punct-amplified',    group: '문장부호', label: '반복 증폭',      test: (f, e) => punctCategory(f, e) === 'amplified' },
  { value: 'punct-last-char',    group: '문장부호', label: '끝 어조 불일치', test: punctLastMismatch },

  { value: 'dup-confirm',        group: '중복 JP',  label: '확정 가능',         test: (f, e) => dupTypeOf(e) === 'confirm' },
  { value: 'dup-strong',         group: '중복 JP',  label: '제안(강한신호)',    test: (f, e) => dupTypeOf(e) === 'strong' },
  { value: 'dup-weak',           group: '중복 JP',  label: '제안(약한신호)',    test: (f, e) => dupTypeOf(e) === 'weak' },
  { value: 'dup-length',         group: '중복 JP',  label: '참고(길이 불일치)', test: (f, e) => dupTypeOf(e) === 'length' },
];
const FILTER_BY_VALUE = new Map(FILTERS.map((f) => [f.value, f]));

function dupTypeOf(e) {
  const sug = dupSuggestionByOffset.get(e.offset);
  return sug ? sug.type : null;
}

// 이 행이 "이미 검토됨"인가 — 후보에서 빼는 규칙의 단일 지점. 예전에는 이 규칙이 계열 분기
// 마다(그리고 건수 계산·행 필터 양쪽에) 네 번 적혀 있었다.
function isReviewedFor(filter, e, fixed) {
  return !!(fixed || e.confirmed);
}

// 검색 비교용 표기 정규화. 이 게임 텍스트는 전각만 쓴다 — KR 실측으로 반각 `!?,~`가 들어간
// 행은 0건이고 전각 `！？，∼`은 각각 3,379 / 1,606 / 1,705 / 266행, 공백도 전각(U+3000)이
// 11,242행인데 반각은 22행뿐이다. 그런데 검색창에 반각을 치는 건 자연스러워서, 스페이스 하나로
// 두 단어를 검색하면(`아무 일도`) 아무것도 안 잡혔다 — 한 단어 검색은 되는데 두 단어는 안 되니
// "가끔 검색이 안 되는" 것처럼 보인다. 수정칸(textarea)은 입력 즉시 전각으로 바꾸지만 검색창은
// 그러지 않아 생긴 비대칭이다.
//
// 검색창은 입력값을 강제로 바꾸지 않고 **비교할 때만** 양쪽을 같은 표기로 맞춘다. 반각 공백이
// 정상인 콘텐츠가 실제로 있기 때문이다(스태프 롤 로마자 이름, `환세취호전 ver.1.1`, `파일
// "%s"` 같은 라벨 22행) — 입력을 치환해 버리면 그쪽을 검색할 수 없게 된다. 양쪽에 같은
// 1:1·길이보존 사상을 적용하므로 예전에 되던 검색이 안 되는 일은 없고, 관대해지기만 한다.
const SEARCH_NORM_MAP = { ' ': '　', '!': '！', '?': '？', ',': '，', '~': '∼', '～': '∼' };
const SEARCH_NORM_RE = /[ !?,~～]/g;
function searchNorm(s) { return s.replace(SEARCH_NORM_RE, (c) => SEARCH_NORM_MAP[c]); }

// 입력을 게임 KR 표기로 맞춘다: 공백·물결표(～→∼)·가운뎃점(・→·, JP엔 있지만 CP949 매핑이
// 없어 그대로 두면 "?"로 깨진다)을 바꾸고, 반각 ASCII(!-}) 전체를 +0xFEE0으로 전각화한다
// (숫자·영문도 이 게임 KR 텍스트는 전부 전각 — ２００Ｇ, ＤＳ２호 등). `ver.1.1`/`"%s"`처럼
// 반각이 정상인 문자열(코퍼스에 `.`나 `%`로 식별 가능)만 건너뛴다. 1글자→1글자라 캐럿 위치가
// 유지된다. 수정칸과 fill bar가 공유한다.
const GAME_FORM_RE = /[\x20-\x7e～・]/;
const GAME_FORM_SKIP_RE = /[.%]/;
function toGameForm(s) {
  const out = s.replace(/ /g, '　').replace(/[~～]/g, '∼').replace(/・/g, '·');
  if (GAME_FORM_SKIP_RE.test(out)) return out;
  return out.replace(/[!-}]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0xFEE0));
}

// A row counts as "미검토" if it has neither an edit nor a 확정(reviewed, no change needed)
// mark — i.e. nobody has looked at it yet. Replaces the old byte-length "문제 있는 것만"
// checkbox, which duplicated the inline Byte column (already shows over/under in red) and
// wasn't actually about review progress.
function isUnreviewed(section, e, fixed) {
  return !fixed && !e.confirmed;
}

// 행 아래에 붙는 참고 주석. 소스는 둘(AI 검토 사유 · 중복JP 제안)이지만 표시 규칙과 수명이
// 같아서(수정/확정되면 사라짐) 한 곳에서 만든다 — 예전에는 거의 똑같은 sync 함수가 두 벌
// 있었다. 필터와는 독립이다: 필터를 안 걸고 봐도 해당 행에 그대로 뜬다.
const DUP_TYPE_LABEL = { confirm: '확정 가능', strong: '제안(강한신호)', weak: '제안(약한신호)', length: '참고(길이 불일치)' };
function annotationsFor(e) {
  if (curSection !== 'dialogue') return [];
  const out = [];
  const finding = findingByOffset.get(e.offset);
  if (finding) {
    out.push({
      cls: 'note-finding',
      label: FINDING_CATEGORY_LABEL[finding.category] || finding.category,
      text: finding.reason,
    });
  }
  const sug = dupSuggestionByOffset.get(e.offset);
  if (sug) {
    // 제안문에 따옴표를 두르지 않는다 — 이 줄은 그대로 긁어서 수정칸에 붙여넣는 용도라,
    // 감싸는 따옴표가 있으면 매번 앞뒤를 떼야 한다. 이 게임 텍스트는 앞뒤 전각 공백이
    // 의미를 갖는 경우가 많은데(패딩·들여쓰기) 따옴표가 그 경계를 보여주긴 했지만,
    // 복붙 편의가 우선이라 뺐다.
    let text = `동일 JP ${sug.agreedCount}건 확정 → ${sug.agreed}`;
    if (sug.type === 'length') text += ` (필요 ${sug.need}B / 이 값 ${sug.got}B — 그대로 못 넣음)`;
    out.push({
      cls: 'note-dup',
      label: `중복 JP: ${DUP_TYPE_LABEL[sug.type] || sug.type}`,
      text,
    });
    // 확정본이 갈렸으면 나머지 후보도 보여준다. 예전에는 1등만 적고 나머지를 숨겨서,
    // 실제로는 확정본이 둘로 갈린 줄인데도 "N건 확정"이라 만장일치처럼 읽혔다. 위 제안문의
    // 복붙(→ 뒤부터)을 방해하지 않도록 별도 줄로 뺀다.
    // 출처 JP가 이 행의 JP와 다르면 그 원문을 보여준다. 그룹핑이 문장부호를 지우고 묶는
    // 탓에 감탄문·의문문이 섞이므로, 제안을 그대로 쓰기 전에 끝 부호를 대조해야 한다.
    if (sug.srcJp) {
      out.push({
        cls: 'note-dup-alt',
        label: '중복 JP: 출처 JP가 다름 — 끝 부호 확인',
        text: sug.srcJp,
      });
    }
    if (sug.others.length) {
      out.push({
        cls: 'note-dup-alt',
        label: `중복 JP: 다른 확정본 ${sug.others.length}종`,
        text: sug.others.join('   ·   '),
      });
    }
  }
  return out;
}

// Per-entry filter predicate — shared by filteredRows() (full list) and dropOffFilteredRow()
// (single-row recheck after an in-place edit/confirm, so a row can disappear the moment it
// stops matching the active filter without waiting for the next full render()).
function passesFilters(e) {
  // 저장에 실패한 행은 필터·검색을 전부 무시하고 항상 보여준다. 이게 없으면 실패한 행이
  // 그대로 사라진다 — 실패한 편집은 modified{}에 남아 currentFixed()가 값을 돌려주고,
  // 자동감지 필터는 "수정됨 = 검토됨"으로 보고 후보에서 빼기 때문이다(isReviewedFor).
  // 필터를 걸고 훑던 중에 저장이 실패하면 어디서 실패했는지 찾을 길이 없어진다.
  if (hasSaveFailure(curSection, e.offset)) return true;
  const q = document.getElementById('searchBox').value; // NOT .trim() — JS trim() also eats
  // U+3000 (전각 공백), which is meaningful leading/trailing content in this game's text
  const exactMatch = document.getElementById('filterExact').checked;
  const unrevOnly = document.getElementById('filterUnreviewed').checked;
  const filterVal = document.getElementById('filterSelect').value;
  const fixed = currentFixed(curSection, e);
  const jp = e.jp || ''; // baked KR<->JP correspondence (dialogue only — see bake-jp.js)
  if (q) {
    if (exactMatch) {
      // 완전 일치만은 정규화하지 않고 글자 그대로 비교한다 — 이 모드가 fill bar(applyFill)를
      // 띄우고, 거기서 잡힌 행 **전부에 같은 값을 덮어쓰기** 때문이다. 표기만 다른 행이
      // 한 덩어리로 묶이면 안 된다. 원문 칸은 클릭 복사가 되므로 정확한 문자열을 넣기 쉽다.
      if (e.text !== q && fixed !== q && jp !== q) return false;
    } else {
      const qn = searchNorm(q);
      if (!searchNorm(e.text).includes(qn) && !searchNorm(fixed).includes(qn)
          && !searchNorm(jp).includes(qn)) return false;
    }
  }
  if (unrevOnly && !isUnreviewed(curSection, e, fixed)) return false;
  if (filterVal) {
    // 자동감지 필터는 전부 대사 전용 — 레이블 탭에는 JP 대응이 없어 판정 자체가 성립 안 한다.
    if (curSection !== 'dialogue') return false;
    const filter = FILTER_BY_VALUE.get(filterVal);
    if (!filter) return false;
    // 이미 검토된 줄은 후보에서 뺀다 — 그래야 처리할 때마다 남은 건수가 줄어든다.
    if (isReviewedFor(filter, e, fixed)) return false;
    if (!filter.test(fixed, e)) return false;
  }
  return true;
}

function filteredRows() {
  return (data[curSection] || []).filter(passesFilters);
}

// Called after an edit/confirm changes one entry's state (see renderRow) — if the row no
// longer matches the currently active filter, drop just that <tr> instead of waiting for
// the next full render(). Also refreshes unreviewed-nav/stats/dropdown counts, which are cheap
// (bounded by filtered-row / finding-set size, not the full ~14,800-row dataset).
function dropRowIfFiltered(tr, e) {
  if (passesFilters(e)) return;
  tr.remove();
  recomputeUnreviewed();
  updateStats();
  renderFilterSelect();
}

// Jump to a specific KR offset: clears every filter (so the row is guaranteed to render),
// switches to the dialogue tab, then scrolls to and briefly highlights the row. Used by the
// toolbar "이동" box.
function jumpToOffset(offset) {
  document.getElementById('searchBox').value = '';
  document.getElementById('filterUnreviewed').checked = false;
  document.getElementById('filterSelect').value = '';
  curSection = 'dialogue';
  render();
  const row = document.querySelector(`tr[data-offset="${offset}"]`);
  if (!row) { toast('해당 오프셋을 찾을 수 없음: ' + offset); return; }
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  row.classList.add('jump-focus');
  setTimeout(() => row.classList.remove('jump-focus'), 2000);
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  if (selection.size === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  document.getElementById('bulkCount').textContent = selection.size + '행 선택';
}

// OFF 칸 클릭으로 범위 선택 (gensei-pc98 이식): 첫 클릭이 시작점, 두 번째 클릭이 끝점 —
// 그 사이 전부가 선택된다. 같은 행을 다시 클릭하면 선택 해제. rangeStart는 현재 렌더된
// 행 순서상의 인덱스라서, 두 클릭 사이에 필터/검색이 안 바뀐다는 전제로만 유효하다.
// Toggles .row-selected/.range-start on the already-rendered <tr> elements directly —
// NOT a full render(), which would rebuild the whole tbody (up to ~14,800 rows) just to
// flip a highlight class. That full-rebuild-per-click was what made selecting feel slow.
function applySelectionClasses(trs) {
  (trs || Array.from(document.getElementById('tbody').children)).forEach((tr, i) => {
    tr.classList.toggle('row-selected', selection.has(tr.dataset.key));
    tr.classList.toggle('range-start', rangeStart !== null && i === rangeStart);
  });
}

document.getElementById('tbody').addEventListener('click', (ev) => {
  const offCell = ev.target.closest('td.off');
  if (!offCell || ev.target.closest('.bookmark-btn')) return;
  const tr = offCell.closest('tr');
  if (!tr) return;
  const trs = Array.from(document.getElementById('tbody').children);
  const idx = trs.indexOf(tr);
  if (idx < 0) return;

  if (rangeStart === null) {
    selection.clear();
    rangeStart = idx;
  } else if (rangeStart === idx) {
    rangeStart = null;
    selection.clear();
  } else {
    const lo = Math.min(rangeStart, idx), hi = Math.max(rangeStart, idx);
    selection.clear();
    for (let i = lo; i <= hi; i++) selection.add(trs[i].dataset.key);
    rangeStart = null;
  }
  updateBulkBar();
  applySelectionClasses(trs);
});

function bulkCopyJp() {
  const texts = [];
  for (const key of selection) {
    const section = key.slice(0, key.indexOf(':'));
    const offset = parseInt(key.slice(key.indexOf(':') + 1), 10);
    const entry = (data[section] || []).find((x) => x.offset === offset);
    if (entry && entry.jp) texts.push(entry.jp);
  }
  navigator.clipboard && navigator.clipboard.writeText(texts.join('\n'));
  toast(texts.length + '건 JP 복사됨');
  selection.clear();
  rangeStart = null;
  updateBulkBar();
  applySelectionClasses();
}
// Bulk "확정" (reviewed, no change needed) for every selected row — same semantics as the
// per-row 확정 button (see renderRow's confirmBtn), just applied to the whole selection at
// once. Rows that already have a fixed edit (in-memory or saved) are skipped, same as the
// per-row button being hidden in that case — an actual edit already supersedes "확정".
async function bulkConfirm() {
  const targets = [];
  for (const key of selection) {
    const section = key.slice(0, key.indexOf(':'));
    const offset = parseInt(key.slice(key.indexOf(':') + 1), 10);
    const entry = (data[section] || []).find((x) => x.offset === offset);
    if (entry && !currentFixed(section, entry) && !entry.confirmed) targets.push({ section, entry });
  }
  if (!targets.length) { toast('확정할 대상이 없습니다 (이미 수정됐거나 확정된 행 제외)'); return; }
  const results = await Promise.all(targets.map(({ section, entry }) =>
    fetch('/api/confirm', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ section, offset: entry.offset, confirmed: true }),
    }).then((r) => r.json()).catch(() => ({ ok: false }))
  ));
  let done = 0;
  results.forEach((res, i) => { if (res.ok) { targets[i].entry.confirmed = res.confirmed; done++; } });
  selection.clear();
  rangeStart = null;
  updateBulkBar();
  render();
  toast(`${done}건 확정 처리됨${done < targets.length ? ` (${targets.length - done}건 실패)` : ''}`);
}
document.getElementById('bulkCopyJp').addEventListener('click', bulkCopyJp);
document.getElementById('bulkConfirm').addEventListener('click', bulkConfirm);
document.getElementById('bulkCancel').addEventListener('click', () => {
  selection.clear();
  rangeStart = null;
  updateBulkBar();
  applySelectionClasses();
});

// Context panel: when a "fixed" textarea is focused, show the row's neighbors in
// original-file order (adjacent index in data.dialogue — same order the text is laid out
// in HWANSE.EXE, so this doubles as a way to spot the "다음/이전 줄 내용을 끌어다 붙인"
// mistranslation pattern, not just a general reading aid). Filters stay untouched — the
// whole point is not needing to clear them to see context.
//
// Starts with a small window around the focused row and grows in both directions as the
// panel is scrolled near either edge (ctxLo/ctxHi track the currently-rendered range).
// Prepending above needs the scrollHeight-delta trick in ctxExtendUp() — inserting DOM
// nodes above the viewport otherwise yanks the visible content down as the browser reflows.
// Initial window needs to be big enough to actually overflow the panel's height — otherwise
// there's nothing to scroll and onContextScroll() never fires, which is why this looked
// like infinite scroll wasn't working at all (11 rows at ±5 didn't reliably overflow).
const CONTEXT_INITIAL = 20;
const CONTEXT_STEP = 10;
const CTX_SCROLL_MARGIN = 80; // px from an edge that triggers loading more in that direction
let ctxLo = 0, ctxHi = -1;

function ctxRowEl(i, isCurrent) {
  const ent = data.dialogue[i];
  const div = document.createElement('div');
  div.className = 'ctx-row' + (isCurrent ? ' current' : '');
  const off = document.createElement('div');
  off.className = 'ctx-off';
  off.textContent = ent.offset;
  div.appendChild(off);
  const kr = document.createElement('div');
  kr.className = 'ctx-kr';
  kr.textContent = ent.text;
  div.appendChild(kr);
  if (ent.fixed) {
    const fx = document.createElement('div');
    fx.className = 'ctx-fixed';
    fx.textContent = ent.fixed;
    div.appendChild(fx);
  }
  if (ent.jp) {
    const jp = document.createElement('div');
    jp.className = 'ctx-jp';
    jp.textContent = ent.jp;
    div.appendChild(jp);
  }
  return div;
}

function ctxExtendUp(rows) {
  if (ctxLo <= 0) return;
  const newLo = Math.max(0, ctxLo - CONTEXT_STEP);
  const frag = document.createDocumentFragment();
  for (let i = newLo; i < ctxLo; i++) frag.appendChild(ctxRowEl(i, false));
  const prevScrollHeight = rows.scrollHeight;
  rows.prepend(frag);
  rows.scrollTop += rows.scrollHeight - prevScrollHeight; // keep viewport pinned to the same content
  ctxLo = newLo;
}

function ctxExtendDown(rows) {
  if (ctxHi >= data.dialogue.length - 1) return;
  const newHi = Math.min(data.dialogue.length - 1, ctxHi + CONTEXT_STEP);
  const frag = document.createDocumentFragment();
  for (let i = ctxHi + 1; i <= newHi; i++) frag.appendChild(ctxRowEl(i, false));
  rows.appendChild(frag);
  ctxHi = newHi;
}

function onContextScroll() {
  const rows = document.getElementById('ctxRows');
  if (rows.scrollTop < CTX_SCROLL_MARGIN) ctxExtendUp(rows);
  else if (rows.scrollHeight - (rows.scrollTop + rows.clientHeight) < CTX_SCROLL_MARGIN) ctxExtendDown(rows);
}

function showContext(e) {
  const idx = dialogueIndexByOffset.get(e.offset);
  if (idx === undefined) return;
  const panel = document.getElementById('contextPanel');
  const rows = document.getElementById('ctxRows');
  rows.innerHTML = '';
  ctxLo = Math.max(0, idx - CONTEXT_INITIAL);
  ctxHi = Math.min(data.dialogue.length - 1, idx + CONTEXT_INITIAL);
  for (let i = ctxLo; i <= ctxHi; i++) rows.appendChild(ctxRowEl(i, i === idx));
  panel.classList.add('open');
  document.body.classList.add('ctx-open');
  // Guarantee actual overflow regardless of row height/screen size — without this, a short
  // initial window can end up NOT overflowing the panel, so there's nothing to scroll and
  // onContextScroll() never fires (looks like "infinite scroll" just doesn't work at all).
  // ONE measurement + at most ONE extension (not a measure/extend/measure/extend... loop —
  // each scrollHeight read forces a synchronous layout, and this runs on every row focus,
  // so a multi-iteration version of this was a real source of the editor feeling laggy).
  if (rows.scrollHeight <= rows.clientHeight) {
    if (ctxLo > 0) ctxExtendUp(rows);
    if (ctxHi < data.dialogue.length - 1) ctxExtendDown(rows);
  }
  const current = rows.querySelector('.ctx-row.current');
  if (current) current.scrollIntoView({ block: 'center' });
}

function render() {
  renderTabs();
  renderFilterSelect();
  const rows = filteredRows();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < rows.length; i++) frag.appendChild(renderRow(rows[i], i));
  tbody.appendChild(frag);
  recomputeUnreviewed();
  updateStats();

  // "완전 일치" 검색으로 여러 행이 잡히면 fill bar를 띄워 한 번에 같이 고칠 수 있게 함.
  const q = document.getElementById('searchBox').value; // NOT .trim() — JS trim() also eats
  // U+3000 (전각 공백), which is meaningful leading/trailing content in this game's text
  const exactMatch = document.getElementById('filterExact').checked;
  const fillBar = document.getElementById('fillBar');
  if (exactMatch && q && rows.length > 0) {
    document.getElementById('fillInfo').textContent = rows.length + '건';
    fillBar.style.display = 'flex';
  } else {
    fillBar.style.display = 'none';
  }
}

// Applies the fill-bar's input text as the `fixed` value for every currently-filtered row
// at once (in-memory only — still goes through the normal save flow/byte-length checks,
// same as editing one row by hand). Only makes sense with "완전 일치" narrowing the rows
// down to occurrences of one exact original string (e.g. a repeated speaker-name line).
function applyFill() {
  const input = document.getElementById('fillInput');
  if (GAME_FORM_RE.test(input.value)) input.value = toGameForm(input.value); // 수정칸과 동일 보정
  const val = input.value;
  if (!val) return;
  const rows = filteredRows();
  for (const e of rows) {
    const k = keyOf(curSection, e);
    if (val === (e.fixed || '')) delete modified[k];
    else modified[k] = val;
  }
  render();
  updateSaveBtn();
  toast(rows.length + '건에 적용됨 (저장은 별도)');
}

function lenCellState(section, e, fixed) {
  const n = need(section, e);
  if (!fixed) return { text: `${n}`, cls: 'empty' };
  const got = byteLen(fixed);
  const v = validity(section, got, n);
  return { text: `${got}/${n}`, cls: v === 'ok' ? 'ok' : 'bad' };
}

function renderRow(e, idx) {
  const tr = document.createElement('tr');
  tr.dataset.offset = e.offset;
  const k = keyOf(curSection, e);
  tr.dataset.key = k;
  if (selection.has(k)) tr.classList.add('row-selected');
  if (rangeStart !== null && idx === rangeStart) tr.classList.add('range-start');
  if (hasSaveFailure(curSection, e.offset)) tr.classList.add('save-failed');

  const tdOff = document.createElement('td');
  tdOff.className = 'off';
  const offRow = document.createElement('div');
  offRow.className = 'off-row';
  const offText = document.createElement('span');
  offText.textContent = e.offset; // decimal — matches jp-reference.json
  offRow.appendChild(offText);
  if (curSection === 'dialogue') {
    const bmBtn = document.createElement('button');
    bmBtn.className = 'bookmark-btn' + (bookmarkOffset === e.offset ? ' active' : '');
    bmBtn.textContent = '🔖';
    bmBtn.title = '책갈피로 지정';
    bmBtn.onclick = async () => {
      try {
        await fetch('/api/bookmark', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ offset: e.offset }),
        });
        document.querySelectorAll('.bookmark-btn.active').forEach((b) => b.classList.remove('active'));
        bmBtn.classList.add('active');
        bookmarkOffset = e.offset;
        toast('책갈피 지정: ' + e.offset);
      } catch (err) { toast('책갈피 저장 실패: ' + err); }
    };
    offRow.appendChild(bmBtn);
  }
  tdOff.appendChild(offRow);

  const tdOrig = document.createElement('td');
  tdOrig.className = 'orig';
  const origText = document.createElement('div');
  origText.textContent = e.text;
  origText.title = '클릭하여 복사';
  origText.onclick = () => {
    navigator.clipboard && navigator.clipboard.writeText(e.text);
    tdOrig.classList.add('copied');
    setTimeout(() => tdOrig.classList.remove('copied'), 600);
  };
  tdOrig.appendChild(origText);

  // Baked KR<->JP correspondence (bake-jp.js, see NOTES.md) — dialogue only, since JP
  // correspondence is only meaningful for story text, not labels.
  if (curSection === 'dialogue' && e.jp) {
    const jpDiv = document.createElement('div');
    jpDiv.className = 'jp-text';
    jpDiv.textContent = e.jp;
    jpDiv.title = '클릭하여 복사';
    jpDiv.onclick = () => {
      navigator.clipboard && navigator.clipboard.writeText(e.jp);
      jpDiv.classList.add('copied');
      setTimeout(() => jpDiv.classList.remove('copied'), 600);
    };
    tdOrig.appendChild(jpDiv);
  }

  // 참고 주석(AI 검토 사유 · 중복 JP 제안) — 아직 수정도 확정도 안 된 동안만 보여준다.
  // 이미 처리된 줄에 계속 떠 있으면 "아직 안 고친 것"처럼 보여서 혼동을 준다. 필터와
  // 별개로(필터 없이 보고 있어도 적용되는) 이 행 자체의 fixed/confirmed 상태만 보고,
  // syncNotes()를 수정/확정 핸들러에서 같이 불러 즉시 사라지게 한다.
  const notes = annotationsFor(e);
  let notesWrap = null;
  function syncNotes() {
    if (!notes.length) return;
    const resolved = !!(currentFixed(curSection, e) || e.confirmed);
    if (resolved) { if (notesWrap) notesWrap.style.display = 'none'; return; }
    if (!notesWrap) {
      notesWrap = document.createElement('div');
      for (const n of notes) {
        const div = document.createElement('div');
        div.className = 'row-note ' + n.cls;
        const label = document.createElement('b');
        label.textContent = `[${n.label}] `;
        div.appendChild(label);
        div.appendChild(document.createTextNode(n.text));
        notesWrap.appendChild(div);
      }
      tdOrig.appendChild(notesWrap);
    }
    notesWrap.style.display = '';
  }
  syncNotes();

  const tdFixed = document.createElement('td');
  tdFixed.className = 'fixed-cell';
  const inner = document.createElement('div');
  inner.className = 'fixed-inner';

  const tdLen = document.createElement('td');
  tdLen.className = 'len';

  const curVal = () => (k in modified ? modified[k] : (e.fixed || ''));
  const isInvalid = (v) => !!(v && validity(curSection, byteLen(v), need(curSection, e)) !== 'ok');

  function refreshLen() {
    const st = lenCellState(curSection, e, curVal());
    tdLen.textContent = st.text;
    tdLen.className = 'len ' + st.cls;
  }

  // "확정" toggle — marks an entry reviewed with no change needed. Only shown when the
  // fixed field is empty (an actual edit supersedes it). Persists immediately (a bool, no
  // batch), independent of the modified{} text-edit batch.
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'confirm-btn';
  function syncConfirmUI() {
    tr.classList.toggle('confirmed', !!e.confirmed);
    confirmBtn.textContent = e.confirmed ? '취소' : '확정';
    confirmBtn.style.display = curVal() ? 'none' : '';
  }
  confirmBtn.addEventListener('click', async () => {
    const next = !e.confirmed;
    confirmBtn.disabled = true;
    try {
      const res = await fetch('/api/confirm', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ section: curSection, offset: e.offset, confirmed: next }),
      }).then((r) => r.json());
      if (res.ok) { e.confirmed = res.confirmed; syncConfirmUI(); syncNotes(); dropRowIfFiltered(tr, e); }
      else toast('확정 실패');
    } catch (err) { toast('확정 실패: ' + err); }
    confirmBtn.disabled = false;
  });

  // Default: a cheap div showing the value (or the KR original as a greyed placeholder).
  const display = document.createElement('div');
  display.className = 'kr-display';
  function paintDisplay() {
    const v = curVal();
    display.textContent = v || e.text;
    display.classList.toggle('placeholder', !v);
    display.classList.toggle('modified', k in modified);
    display.classList.toggle('invalid', isInvalid(v));
  }
  paintDisplay();
  // mousedown (not click) + preventDefault so upgrading doesn't first select the div's text.
  display.addEventListener('mousedown', (ev) => { ev.preventDefault(); tr._edit(); });

  // Upgrade this one row's display to a real <textarea> for editing. Called on click, and
  // by jumpToOffset()/gotoUnreviewed() via tr._edit. Idempotent — reuses an existing textarea.
  tr._edit = function upgradeToTextarea() {
    let ta = inner.querySelector('.kr-input');
    if (!ta) {
      ta = document.createElement('textarea');
      ta.className = 'kr-input' + (k in modified ? ' modified' : '') + (isInvalid(curVal()) ? ' invalid' : '');
      ta.rows = 1;
      ta.value = curVal();
      ta.placeholder = e.text;
      ta.dataset.key = k;
      ta.addEventListener('focus', () => { if (curSection === 'dialogue' && ctxAutoShow) showContext(e); });
      ta.addEventListener('input', () => {
        // 입력 즉시 게임 표기로 맞춘다(toGameForm 주석 참고). 1글자→1글자라 캐럿이 유지된다.
        if (GAME_FORM_RE.test(ta.value)) {
          const s = ta.selectionStart, en = ta.selectionEnd;
          ta.value = toGameForm(ta.value);
          ta.setSelectionRange(s, en);
        }
        const v = ta.value;
        if (v === (e.fixed || '')) { delete modified[k]; ta.classList.remove('modified'); }
        else { modified[k] = v; ta.classList.add('modified'); }
        ta.classList.remove('saved');
        ta.classList.toggle('invalid', isInvalid(v));
        refreshLen();
        syncConfirmUI();
        syncNotes();
        updateSaveBtn();
        // recomputeUnreviewed()/updateStats() scan the whole section — debounced so they run
        // once after typing pauses instead of on every keystroke.
        scheduleStatsUpdate();
      });
      // Only recheck the active filter on blur, not on every keystroke — removing the row
      // mid-input would yank the textarea out from under the reviewer while they're still
      // typing. Blur means they've moved on, so it's safe to drop the row if it no longer
      // matches (e.g. typing anything into 문장부호 의심/AI 필터 rows excludes them).
      ta.addEventListener('blur', () => dropRowIfFiltered(tr, e));
      inner.replaceChild(ta, display);
    }
    ta.focus();
    const n = ta.value.length;
    ta.setSelectionRange(n, n);
  };

  inner.append(display, confirmBtn);
  refreshLen();
  syncConfirmUI();
  tdFixed.appendChild(inner);
  tr.append(tdOff, tdOrig, tdFixed, tdLen);
  return tr;
}

function recomputeUnreviewed() {
  // Compute from the data model (rows no longer all carry a textarea to query — see
  // renderRow's lazy upgradeToTextarea). Stores offsets; gotoUnreviewed() finds the <tr> by
  // data-offset (all filtered rows are still in the DOM).
  unreviewedOffsets = filteredRows()
    .filter((e) => isUnreviewed(curSection, e, currentFixed(curSection, e)))
    .map((e) => e.offset);
  const nav = document.getElementById('unrevNav');
  if (unreviewedOffsets.length) {
    document.getElementById('unrevCount').textContent = unreviewedOffsets.length + '건 ';
    nav.style.display = 'inline-flex';
    if (unreviewedIdx >= unreviewedOffsets.length) unreviewedIdx = unreviewedOffsets.length - 1;
  } else {
    nav.style.display = 'none';
    unreviewedIdx = -1;
  }
}

function hasSaveFailure(section, offset) {
  return saveFailures.some((f) => f.section === section && f.offset === offset);
}

function refreshSaveFailureNav() {
  const nav = document.getElementById('failNav');
  if (!saveFailures.length) { nav.style.display = 'none'; saveFailureIdx = -1; return; }
  document.getElementById('failCount').textContent = `저장 실패 ${saveFailures.length}건 `;
  nav.style.display = 'inline-flex';
  if (saveFailureIdx >= saveFailures.length) saveFailureIdx = saveFailures.length - 1;
}

// 실패한 행으로 이동한다. 다른 탭(레이블)에서 실패한 건도 있을 수 있어 필요하면 섹션을
// 바꾸고 다시 그린다. 필터·검색은 건드리지 않는다 — passesFilters()가 실패 행을 이미
// 무조건 통과시키므로 사용자가 걸어둔 검토 맥락을 깰 이유가 없다.
function gotoSaveFailure(delta) {
  if (!saveFailures.length) return;
  saveFailureIdx = (saveFailureIdx + delta + saveFailures.length) % saveFailures.length;
  const f = saveFailures[saveFailureIdx];
  if (curSection !== f.section) {
    curSection = f.section;
    selection.clear();
    rangeStart = null;
    updateBulkBar();
    renderTabs();
    render();
  }
  const tr = document.querySelector(`#tbody tr[data-offset="${f.offset}"]`);
  if (!tr) { toast(`${f.offset} 행을 찾지 못했습니다`); return; }
  document.querySelectorAll('tr.unrev-focus').forEach((r) => r.classList.remove('unrev-focus'));
  tr.classList.add('unrev-focus');
  tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
  if (tr._edit) tr._edit();
  toast(`${saveFailureIdx + 1}/${saveFailures.length} · ${f.offset} — ${f.error}`);
}

function gotoUnreviewed(delta) {
  if (!unreviewedOffsets.length) return;
  unreviewedIdx = (unreviewedIdx + delta + unreviewedOffsets.length) % unreviewedOffsets.length;
  const tr = document.querySelector(`#tbody tr[data-offset="${unreviewedOffsets[unreviewedIdx]}"]`);
  if (!tr) return;
  document.querySelectorAll('tr.unrev-focus').forEach((r) => r.classList.remove('unrev-focus'));
  tr.classList.add('unrev-focus');
  tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
  if (tr._edit) tr._edit();
}

function countModifiedAll() { return Object.keys(modified).length; }
function updateSaveBtn() {
  document.getElementById('saveBtn').disabled = countModifiedAll() === 0;
}

function updateStats() {
  // reviewed = entries that either have an edit (effective fixed) or are marked confirmed
  // (reviewed, no change needed), across ALL sections.
  let total = 0, done = 0;
  for (const s of SECTIONS) {
    for (const e of (data[s.key] || [])) {
      total++;
      if (currentFixed(s.key, e) || e.confirmed) done++;
    }
  }
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('statsText').textContent = `${done} / ${total} (${pct}%)`;
  const circ = 2 * Math.PI * 14;
  document.getElementById('donutArc').setAttribute('stroke-dasharray', `${(circ * done / (total || 1)).toFixed(1)} ${circ.toFixed(1)}`);
}

// 헤더(th)는 position:sticky로 --topbar-h 만큼 내려온 자리에 붙는다. 이 값이 실제 topbar
// 높이와 어긋나면 헤더가 엉뚱한 높이에 떠서 행 내용을 덮거나, topbar와의 사이로 행이 비쳐
// 보인다. topbar 높이는 .toolbar가 flex-wrap이라 생각보다 자주 바뀐다:
//   - 맥락 패널이 열리면 body에 padding-right:376px가 붙어 툴바가 두 줄로 접힌다 (편집 중
//     상시 발생 — 행에 포커스할 때마다 열린다)
//   - 미검토/저장 실패 네비가 나타나거나 사라진다
//   - 필터 드롭다운의 "(남은 건수)" 라벨 길이가 바뀌고, 0이 된 옵션은 사라져 select 폭이 준다
//   - 창 크기 변경
// 예전에는 render()와 window resize에서만 다시 쟀는데, 위 변화 중 다수는 render() 없이
// 일어난다(특히 타이핑 중 도는 scheduleStatsUpdate와 dropRowIfFiltered가 네비·드롭다운을
// 갱신한다). 호출처를 일일이 늘리는 대신 topbar 자체의 크기 변화를 관찰한다 — 원인이 무엇이든
// 빠지지 않고, 새 UI 요소를 툴바에 추가해도 따로 챙길 게 없다.
function updateStickyOffset() {
  const h = document.querySelector('.topbar').offsetHeight;
  document.documentElement.style.setProperty('--topbar-h', h + 'px');
}
new ResizeObserver(updateStickyOffset).observe(document.querySelector('.topbar'));

async function saveAll() {
  const keys = Object.keys(modified);
  if (!keys.length) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '저장 중...';
  const edits = keys.map((k) => {
    const [section, offStr] = [k.slice(0, k.indexOf(':')), k.slice(k.indexOf(':') + 1)];
    return { key: k, section, offset: parseInt(offStr, 10), fixed: modified[k] };
  });
  let result;
  try {
    result = await fetch('/api/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ edits }),
    }).then((r) => r.json());
  } catch (err) {
    btn.textContent = '저장'; btn.disabled = false;
    toast('저장 실패: ' + err); return;
  }
  let saved = 0;
  // 이번 저장의 실패 목록으로 통째로 교체한다. saveAll()은 항상 modified{} 전체를 보내므로
  // 지난번 실패도 매번 재시도되고, 고쳐진 것은 여기서 자연히 빠진다.
  saveFailures = [];
  for (const [k, res] of Object.entries(result.results || {})) {
    const section = k.slice(0, k.indexOf(':'));
    const offset = parseInt(k.slice(k.indexOf(':') + 1), 10);
    if (res.ok) {
      saved++;
      // commit into in-memory data (server may have padded labels), drop from modified
      const entry = (data[section] || []).find((e) => e.offset === offset);
      if (entry) entry.fixed = res.fixed;
      delete modified[k];
    } else {
      saveFailures.push({ key: k, section, offset, error: res.error || '알 수 없는 오류' });
    }
  }
  saveFailures.sort((a, b) => (a.section === b.section ? a.offset - b.offset : a.section < b.section ? -1 : 1));
  saveFailureIdx = -1;
  btn.textContent = '저장';
  updateSaveBtn();
  refreshSaveFailureNav();
  // Rows are lazy displays now (no per-row textarea to patch in place), so just re-render
  // to reflect saved values — cheap since it's divs, and save is an infrequent action.
  render();
  if (saveFailures.length) {
    // 실패 지점을 직접 찾아다니지 않아도 되게 첫 실패로 바로 데려간다. 이후 건은 툴바의
    // "저장 실패 N건 이전/다음"으로 넘긴다.
    gotoSaveFailure(1);
  } else {
    toast(`${saved}건 저장했습니다.`);
  }
}

async function buildAndInject() {
  if (Object.keys(modified).length) {
    toast('미저장 변경이 있습니다 — 저장 후 빌드하세요');
    return;
  }
  const btn = document.getElementById('buildInjectBtn');
  btn.disabled = true; btn.textContent = '빌드 및 삽입 중...';
  let result;
  try {
    result = await fetch('/api/build-inject', { method: 'POST' }).then((r) => r.json());
  } catch (err) {
    btn.disabled = false; btn.textContent = '빌드 및 삽입';
    toast('빌드 및 삽입 실패: ' + err);
    return;
  }
  btn.disabled = false; btn.textContent = '빌드 및 삽입';
  toast(result.message);
}

async function deploy() {
  const btn = document.getElementById('deployBtn');
  btn.disabled = true; btn.textContent = '배포 중...';
  let result;
  try {
    result = await fetch('/api/deploy', { method: 'POST' }).then((r) => r.json());
  } catch (err) {
    btn.disabled = false; btn.textContent = '배포';
    toast('배포 실패: ' + err);
    return;
  }
  btn.disabled = false; btn.textContent = '배포';
  toast(result.message);
}

document.getElementById('saveBtn').addEventListener('click', saveAll);
document.getElementById('buildInjectBtn').addEventListener('click', buildAndInject);
document.getElementById('deployBtn').addEventListener('click', deploy);
document.getElementById('searchBox').addEventListener('input', debounce(render, 150));
document.getElementById('filterExact').addEventListener('change', render);
document.getElementById('fillApply').addEventListener('click', applyFill);
document.getElementById('fillInput').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') applyFill();
});
document.getElementById('filterUnreviewed').addEventListener('change', render);
document.getElementById('filterSelect').addEventListener('change', render);
document.getElementById('jumpBtn').addEventListener('click', () => {
  const v = document.getElementById('jumpBox').value.trim();
  const n = parseInt(v, 10);
  if (!Number.isFinite(n)) { toast('숫자 오프셋을 입력하세요'); return; }
  jumpToOffset(n);
});
document.getElementById('jumpBox').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') document.getElementById('jumpBtn').click();
});
document.getElementById('bookmarkBtn').addEventListener('click', () => {
  if (bookmarkOffset === null) { toast('저장된 책갈피가 없습니다'); return; }
  jumpToOffset(bookmarkOffset);
});
document.getElementById('unrevPrev').addEventListener('click', () => gotoUnreviewed(-1));
document.getElementById('unrevNext').addEventListener('click', () => gotoUnreviewed(1));
document.getElementById('failPrev').addEventListener('click', () => gotoSaveFailure(-1));
document.getElementById('failNext').addEventListener('click', () => gotoSaveFailure(1));

// Home/End/PageUp/PageDown scroll the whole page by default — with a ~14,800-row table,
// one stray press (easy to hit next to the arrow keys while reviewing) jumps the viewport
// far away from the row being worked on. Block them at the document level, but only when
// focus isn't in a text field — inside a textarea/input these keys are legitimate cursor
// movement (jump to line start/end) and must keep working.
const PAGE_SCROLL_KEYS = new Set(['Home', 'End', 'PageUp', 'PageDown']);
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyS') { e.preventDefault(); saveAll(); }
  if (PAGE_SCROLL_KEYS.has(e.code)) {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag !== 'TEXTAREA' && tag !== 'INPUT') e.preventDefault();
  }
});
window.addEventListener('beforeunload', (e) => {
  if (countModifiedAll() > 0) { e.preventDefault(); e.returnValue = ''; }
});

document.getElementById('ctxClose').addEventListener('click', () => {
  document.getElementById('contextPanel').classList.remove('open');
  document.body.classList.remove('ctx-open');
});
document.getElementById('ctxRows').addEventListener('scroll', onContextScroll);

const ctxAutoToggle = document.getElementById('ctxAutoToggle');
ctxAutoToggle.checked = ctxAutoShow;
ctxAutoToggle.addEventListener('change', () => {
  ctxAutoShow = ctxAutoToggle.checked;
  localStorage.setItem('suikoCtxAuto', ctxAutoShow ? '1' : '0');
  if (!ctxAutoShow) {
    document.getElementById('contextPanel').classList.remove('open');
    document.body.classList.remove('ctx-open');
    return;
  }
  // Turning back on: if a dialogue row is currently being edited, show its context right
  // away instead of waiting for the next focus event (which won't fire again if the
  // textarea already has focus from before the toggle).
  const active = document.activeElement;
  if (active && active.classList && active.classList.contains('kr-input') && curSection === 'dialogue') {
    const offset = parseInt(active.dataset.key.split(':')[1], 10);
    const idx = dialogueIndexByOffset.get(offset);
    if (idx !== undefined) showContext(data.dialogue[idx]);
  }
});

// sticky 헤더 오프셋은 .topbar의 ResizeObserver가 갱신한다(updateStickyOffset 위 주석 참고)
// — 창 크기 변경도 topbar 높이가 실제로 바뀔 때만 반영하면 되므로 별도 resize 리스너는 없다.
load();
</script>
